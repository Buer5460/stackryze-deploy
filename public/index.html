<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b55d5"><title>GlobalStudy H5 MVP</title><style>:root{--b:#0b55d5;--bg:#f5f7fb;--ink:#142033;--m:#718096;--line:#e6edf5;--g:#16a36a;--gold:#a66c0f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0b55d5,#2c7ef8);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;display:flex;justify-content:space-between;align-items:center}header small{opacity:.75}header h1{font-size:20px;margin:3px 0 0}.switch{border:1px solid #ffffff66;background:#ffffff20;color:#fff;border-radius:99px;padding:8px 12px}main{max-width:620px;margin:auto;padding:14px 14px calc(82px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(145deg,#0d63df,#55a5ff);color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 32px #0b55d533}.hero h2{font-size:23px;margin:4px 0 8px}.hero p{font-size:13px;line-height:1.7;opacity:.94}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:700}.white{background:#fff;color:var(--b)}.primary{background:var(--b);color:#fff}.outline{background:#fff;border:1px solid #cfd9e6;color:#36506c}.success{background:#e9f8f1;color:#08774a}.hero .btn{margin-top:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric,.card,.row{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 24px #1f355012}.metric{padding:14px}.metric small{color:var(--m);font-size:11px}.metric b{display:block;font-size:20px;margin-top:5px}.section{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.section h3{margin:0;font-size:17px}.section span{color:var(--m);font-size:11px}.cards,.list{display:grid;gap:10px}.card,.row{padding:14px}.card h4,.row h4{margin:0 0 5px;font-size:15px}.muted{color:var(--m);font-size:11px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip,.status{font-size:10px;border-radius:999px;padding:4px 7px;background:#eef5ff;color:#32669c}.good{background:#eaf8f1;color:#128155}.warn{background:#fff5e3;color:#95600d}.split{display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--m)}.split b{font-size:13px;color:var(--ink)}.actions{display:flex;gap:8px;margin-top:11px}.actions .btn{flex:1}.rowtop{display:flex;justify-content:space-between;gap:10px}.progress{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#0b55d5,#49a0ff)}.notice{background:#eef6ff;border:1px solid #d7e8fb;color:#41617e;border-radius:14px;padding:11px;font-size:11px;line-height:1.6}.search{display:flex;gap:8px;margin-bottom:10px}.search input,.search select,input,select{width:100%;border:1px solid #dfe6ef;background:#fff;border-radius:13px;padding:11px}.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fffffff7;border-top:1px solid var(--line);display:flex;z-index:20}.bottom button{flex:1;border:0;background:transparent;color:#8090a2;font-size:10px}.bottom button b{display:block;font-size:18px;font-weight:400}.bottom .on{color:var(--b)}.mask{position:fixed;inset:0;background:#0c192b70;opacity:0;pointer-events:none;z-index:30}.mask.on{opacity:1;pointer-events:auto}.sheet{position:fixed;left:0;right:0;bottom:-90vh;max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));z-index:40;transition:.25s}.sheet.on{bottom:0}.sheethead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}.timeline{border-left:2px solid #dce8f5;margin:12px 0 0 8px;padding-left:17px}.ti{margin:0 0 18px;font-size:12px}.ti b{display:block}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;text-align:left}.role b{display:block}.role span{font-size:10px;color:var(--m)}@media(min-width:700px){header,.bottom,.sheet{max-width:620px;margin:auto}.bottom{left:50%;transform:translateX(-50%)}}</style></head><body><header><div><small>GLOBALSTUDY · MOBILE MVP</small><h1 id="title">学生 / 家长端</h1></div><button class="switch" onclick="chooseRole()">切换角色</button></header><main id="view"></main><nav class="bottom" id="nav"></nav><div class="mask" id="mask" onclick="closeSheet()"></div><section class="sheet" id="sheet"><div class="sheethead"><b id="sheetTitle">详情</b><button class="btn outline" onclick="closeSheet()">关闭</button></div><div id="sheetBody" style="padding-top:12px"></div></section><script>const $=s=>document.querySelector(s);let role=localStorage.getItem('gs-role')||'student',page='home',data=null;const R={student:{t:'学生 / 家长端',m:[['home','⌂','首页'],['programs','⌕','找项目'],['applications','◎','申请'],['profile','◉','我的']]},agency:{t:'机构工作台',m:[['home','⌂','工作台'],['clients','♙','客户'],['programs','⌕','项目'],['applications','◎','申请']]},supplier:{t:'院校 / 供应商',m:[['home','⌂','工作台'],['programs','▦','项目'],['applications','◎','受理'],['ads','◈','推广']]},admin:{t:'平台管理后台',m:[['home','⌂','总览'],['audits','✓','审核'],['applications','◎','申请'],['settlement','¥','结算']]}};const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');async function api(u,o){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j.data}async function load(){data=await api('/api/bootstrap');render()}function nav(p){page=p;render()}function setRole(r){role=r;page='home';localStorage.setItem('gs-role',r);closeSheet();render()}function openSheet(t,h){$('#sheetTitle').textContent=t;$('#sheetBody').innerHTML=h;$('#sheet').classList.add('on');$('#mask').classList.add('on')}function closeSheet(){$('#sheet').classList.remove('on');$('#mask').classList.remove('on')}function chooseRole(){openSheet('选择体验角色','<div class="rolegrid">'+Object.entries(R).map(([k,v])=>`<button class="role" onclick="setRole('${k}')"><b>${v.t}</b><span>${k==='student'?'找项目、建档、申请':k==='agency'?'客户、申请、协同':k==='supplier'?'项目、受理、推广':'审核、运营、结算'}</span></button>`).join('')+'</div>')}function metric(t,v){return `<div class="metric"><small>${t}</small><b>${v}</b></div>`}function hero(t,d,cta,fn){return `<section class="hero"><small>S2B2C STUDY ABROAD</small><h2>${t}</h2><p>${d}</p><button class="btn white" onclick="${fn}">${cta}</button></section>`}function st(s){return ['已录取','已通过'].some(x=>s.includes(x))?'good':['材料准备','待审核'].some(x=>s.includes(x))?'warn':''}function programCards(a){return '<div class="cards">'+a.map(p=>`<div class="card"><h4>${p.program}</h4><div class="muted">${p.school} · ${p.country}</div><div class="chips"><span class="chip">${p.degree}</span><span class="chip">${p.lang}</span><span class="chip ${p.fit.includes('符合')?'good':'warn'}">${p.fit}</span><span class="chip warn">奖助 ${money(p.scholarship)}</span></div><div class="split"><span>学费参考<br><b>${money(p.fee)}/年</b></span><span style="text-align:right">截止<br><b>${p.deadline}</b></span></div><div class="actions"><button class="btn outline" onclick="detail(${p.id})">详情</button><button class="btn primary" onclick="apply(${p.id})">申请</button></div></div>`).join('')+'</div>'}function apps(a){return '<div class="list">'+a.map(x=>{const p=data.programs.find(z=>z.id===x.programId);return `<div class="row" onclick="appDetail('${x.id}')"><div class="rowtop"><div><h4>${x.student} · ${p?p.program:'申请'}</h4><div class="muted">${x.school}</div></div><span class="status ${st(x.status)}">${x.status}</span></div><div class="progress"><i style="width:${x.progress}%"></i></div><div class="muted">进度 ${x.progress}% · 预计佣金 ${money(x.commission)}</div></div>`}).join('')+'</div>'}function home(){if(role==='student'){const mine=data.applications.filter(a=>a.student===data.profile.name);return hero('找学校、奖学金和申请，一部手机完成。','自己建档，也可以授权机构协同；所有申请进度集中查看。','开始找项目',"nav('programs')")+`<div class="metrics">${metric('档案完整度',data.profile.completion+'%')}${metric('进行中申请',mine.length)}${metric('推荐项目',data.programs.length)}${metric('奖助机会','¥55,000')}</div><div class="section"><h3>适合你的项目</h3><span>规则初筛</span></div>${programCards(data.programs)}`}if(role==='agency'){return hero('客户和申请，放进一个手机工作台。','顾问可代建档，也可邀请学生自己完善资料。','新增客户','clientForm()')+`<div class="metrics">${metric('客户',data.clients.length)}${metric('申请',data.applications.length)}${metric('预计佣金',money(data.applications.reduce((s,a)=>s+a.commission,0)))}${metric('材料及时率','87%')}</div><div class="section"><h3>客户</h3><span>客户归属保留</span></div>${clients()}`}if(role==='supplier')return hero('院校也能在手机上受理申请。','查看材料、补件、录取与推广。','查看申请',"nav('applications')")+`<div class="metrics">${metric('在架项目','8')}${metric('本月申请','23')}${metric('待处理','6')}${metric('推广曝光','18,620')}</div><div class="section"><h3>待处理</h3><span>已授权</span></div>${apps(data.applications.filter(a=>a.school.includes('南洋')))}`;return hero('平台看的是完整业务闭环。','审核机构、院校、项目、申请和结算。','进入审核',"nav('audits')")+`<div class="metrics">${metric('活跃B端','18')}${metric('活跃S端','12')}${metric('全局申请','53')}${metric('待审核',data.audits.filter(a=>a.status==='待审核').length)}</div><div class="section"><h3>待审核</h3><span>运营处理</span></div>${audits()}`}function programs(){return `<div class="search"><input id="q" placeholder="学校 / 专业 / 国家" oninput="filterP()"><select id="c" onchange="filterP()"><option value="">全部</option>${[...new Set(data.programs.map(x=>x.country))].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="plist">${programCards(data.programs)}</div>`}function filterP(){const q=$('#q').value.toLowerCase(),c=$('#c').value;$('#plist').innerHTML=programCards(data.programs.filter(p=>(!q||[p.school,p.program,p.country].join(' ').toLowerCase().includes(q))&&(!c||p.country===c)))}function clients(){return '<div class="list">'+data.clients.map(c=>`<div class="row"><div class="rowtop"><div><h4>${c.name}</h4><div class="muted">${c.source} · ${c.owner}</div></div><span class="status ${st(c.stage)}">${c.stage}</span></div><div class="progress"><i style="width:${c.completion}%"></i></div><div class="muted">档案 ${c.completion}%</div></div>`).join('')+'</div>'}function audits(){return '<div class="list">'+data.audits.map(a=>`<div class="row"><div class="rowtop"><div><h4>${a.name}</h4><div class="muted">${a.type} · ${a.org}</div></div><span class="status ${st(a.status)}">${a.status}</span></div>${a.status==='待审核'?`<div class="actions"><button class="btn success" onclick="approve(${a.id})">通过</button></div>`:''}</div>`).join('')+'</div>'}function content(){if(page==='home')return home();if(page==='programs')return programs();if(page==='applications'){let a=data.applications;if(role==='student')a=a.filter(x=>x.student===data.profile.name);if(role==='supplier')a=a.filter(x=>x.school.includes('南洋'));return `<div class="section"><h3>申请管理</h3><span>统一状态机</span></div>${apps(a)}`}if(page==='clients')return `<div class="section"><h3>客户 CRM</h3><button class="btn primary" onclick="clientForm()">＋新增</button></div><div class="notice">学生可通过机构专属邀请自行建档，客户归属仍归机构。</div><br>${clients()}`;if(page==='profile')return `<div class="card"><h4>${data.profile.name}</h4><div class="progress"><i style="width:${data.profile.completion}%"></i></div>${[['学历',data.profile.education],['GPA',data.profile.gpa],['语言',data.profile.english],['预算',data.profile.budget],['目标',data.profile.country]].map(x=>`<div class="split"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`;if(page==='audits')return `<div class="section"><h3>审核中心</h3><span>B / S / 项目</span></div>${audits()}`;if(page==='ads')return `<div class="metrics">${metric('投放中','1')}${metric('曝光','18,620')}${metric('线索','64')}${metric('预算','¥3,600')}</div><div class="notice" style="margin-top:12px">MVP 不进行真实扣款，V1.5 再接支付。</div>`;if(page==='settlement')return `<div class="metrics">${metric('预计佣金',money(data.applications.reduce((s,a)=>s+a.commission,0)))}${metric('平台应收','¥62,700')}${metric('B端应付','¥24,700')}${metric('广告收入','¥12,600')}</div><div class="notice" style="margin-top:12px">正式版按课程、批次、渠道和合同版本生成结算台账。</div>`}function render(){const cfg=R[role];$('#title').textContent=cfg.t;$('#nav').innerHTML=cfg.m.map(m=>`<button class="${page===m[0]?'on':''}" onclick="nav('${m[0]}')"><b>${m[1]}</b>${m[2]}</button>`).join('');$('#view').innerHTML=content()}function detail(id){const p=data.programs.find(x=>x.id===id);openSheet(p.program,`<div class="notice">演示数据。正式产品展示来源、审核状态、更新时间和适用批次。</div><div class="section"><h3>${p.school}</h3><span>${p.country}</span></div><div class="chips"><span class="chip">${p.degree}</span><span class="chip">${p.lang}</span><span class="chip warn">奖助 ${money(p.scholarship)}</span></div><div class="split"><span>学费参考</span><b>${money(p.fee)}/年</b></div><div class="split"><span>截止</span><b>${p.deadline}</b></div><br><div class="notice">${p.fit}。这里只做规则初筛，不虚构录取概率。</div>`)}async function apply(id){try{await api('/api/applications',{method:'POST',body:JSON.stringify({student:data.profile.name,programId:id,agency:role==='agency'?'环球学桥（演示）':'待授权机构'})});data=await api('/api/bootstrap');page='applications';render()}catch(e){alert(e.message)}}function appDetail(id){const a=data.applications.find(x=>x.id===id);openSheet('申请 '+id,`<h3>${a.student}</h3><div class="notice">${a.agency} → ${a.school}</div><div class="timeline"><div class="ti"><b>建立申请</b><span class="muted">档案已关联</span></div><div class="ti"><b>材料准备</b><span class="muted">当前：${a.status}</span></div><div class="ti"><b>院校受理 / 补件</b></div><div class="ti"><b>录取 / 奖学金</b></div><div class="ti"><b>入学 / 结算</b></div></div>${role==='supplier'&&a.status==='院校受理'?`<div class="actions"><button class="btn outline" onclick="upd('${id}','补件中')">要求补件</button><button class="btn success" onclick="upd('${id}','已录取')">录取演示</button></div>`:''}`)}async function upd(id,s){await api('/api/applications/'+id,{method:'PATCH',body:JSON.stringify({status:s,progress:s==='已录取'?88:65})});data=await api('/api/bootstrap');closeSheet();render()}function clientForm(){openSheet('新增客户','<div class="notice">顾问可代建档，也可邀请学生自行建档。</div><p><input id="cn" placeholder="学生姓名"></p><p><select id="co"><option>王老师</option><option>周老师</option></select></p><button class="btn primary" style="width:100%" onclick="createClient()">创建客户</button>')}async function createClient(){const name=$('#cn').value.trim();if(!name)return;await api('/api/clients',{method:'POST',body:JSON.stringify({name,owner:$('#co').value})});data=await api('/api/bootstrap');closeSheet();page='clients';render()}async function approve(id){await api('/api/audits/'+id,{method:'PATCH',body:JSON.stringify({status:'已通过'})});data=await api('/api/bootstrap');render()}load();</script></body></html>
