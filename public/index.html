<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b55d5">
<title>GlobalStudy H5 MVP</title>
<style>
:root{--b:#0b55d5;--bg:#f5f7fb;--ink:#142033;--m:#718096;--line:#e6edf5;--g:#16a36a;--gold:#a66c0f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0b55d5,#2c7ef8);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.75}
header h1{font-size:20px;margin:3px 0 0}
.switch{border:1px solid #ffffff66;background:#ffffff20;color:#fff;border-radius:99px;padding:8px 12px}
main{max-width:620px;margin:auto;padding:14px 14px calc(82px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(145deg,#0d63df,#55a5ff);color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 32px #0b55d533}
.hero h2{font-size:23px;margin:4px 0 8px}
.hero p{font-size:13px;line-height:1.7;opacity:.94}
.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:700}
.white{background:#fff;color:var(--b)}
.primary{background:var(--b);color:#fff}
.outline{background:#fff;border:1px solid #cfd9e6;color:#36506c}
.success{background:#e9f8f1;color:#08774a}
.danger{background:#fdeeee;color:#b3261e}
.hero .btn{margin-top:8px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric,.card,.row{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 24px #1f355012}
.metric{padding:14px}
.metric small{color:var(--m);font-size:11px}
.metric b{display:block;font-size:20px;margin-top:5px}
.section{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}
.section h3{margin:0;font-size:17px}
.section span{color:var(--m);font-size:11px}
button.linklike{border:0;background:transparent;color:var(--b);font-size:11px;padding:0}
.cards,.list{display:grid;gap:10px}
.card,.row{padding:14px}
.card h4,.row h4{margin:0 0 5px;font-size:15px}
.muted{color:var(--m);font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip,.status{font-size:10px;border-radius:999px;padding:4px 7px;background:#eef5ff;color:#32669c}
.chip{border:0;cursor:pointer}
.chip.on{background:var(--b);color:#fff}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;flex-wrap:nowrap}
.quick .chip{white-space:nowrap;flex:0 0 auto;background:#fff;border:1px solid var(--line);color:#36506c}
.quick .chip.on{background:var(--b);border-color:var(--b);color:#fff}
.good{background:#eaf8f1;color:#128155}
.warn{background:#fff5e3;color:#95600d}
.split{display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--m)}
.split b{font-size:13px;color:var(--ink);text-align:right}
.actions{display:flex;gap:8px;margin-top:11px}
.actions .btn{flex:1;padding:10px 6px;font-size:12px}
.rowtop{display:flex;justify-content:space-between;gap:10px}
.progress{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#0b55d5,#49a0ff)}
.notice{background:#eef6ff;border:1px solid #d7e8fb;color:#41617e;border-radius:14px;padding:11px;font-size:11px;line-height:1.6}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input,.search select,input,select{width:100%;border:1px solid #dfe6ef;background:#fff;border-radius:13px;padding:11px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.formgrid .full{grid-column:1/3}
.field{font-size:10px;color:var(--m);display:block;margin-bottom:3px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fffffff7;border-top:1px solid var(--line);display:flex;z-index:20}
.bottom button{flex:1;border:0;background:transparent;color:#8090a2;font-size:10px}
.bottom button b{display:block;font-size:18px;font-weight:400}
.bottom .on{color:var(--b)}
.mask{position:fixed;inset:0;background:#0c192b70;opacity:0;pointer-events:none;z-index:30}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:-90vh;max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));z-index:40;transition:.25s}
.sheet.on{bottom:0}
.sheethead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.timeline{border-left:2px solid #dce8f5;margin:12px 0 0 8px;padding-left:17px}
.ti{margin:0 0 18px;font-size:12px}
.ti b{display:block}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;text-align:left}
.role b{display:block}
.role span{font-size:10px;color:var(--m)}
.ctable{width:100%;border-collapse:collapse;font-size:11px}
.ctable th,.ctable td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.ctable th{color:var(--m);font-weight:400;white-space:nowrap}
.ctable td{max-width:150px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}
.pager .btn{padding:9px 16px}
.pager .btn[disabled]{opacity:.45}
@media(min-width:700px){header,.bottom,.sheet{max-width:620px;margin:auto}.bottom{left:50%;transform:translateX(-50%)}}
/* --- V1.0 additions --- */
.backbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.backbar button{border:0;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--b);font-weight:700}
.demobanner{background:#fff5e3;border:1px solid #f0dcb0;color:#95600d;border-radius:14px;padding:11px;font-size:11px;line-height:1.6;margin-bottom:12px}
.sec{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}
.sec h3{margin:0 0 10px;font-size:15px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;color:var(--m)}
.kv b{color:var(--ink);font-weight:600;text-align:right;max-width:60%}
.imgarea{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgph{background:linear-gradient(135deg,#e8eef7,#dce7f5);border:1px solid var(--line);border-radius:14px;height:120px;display:flex;align-items:center;justify-content:center;color:#8fa3bd;font-size:11px;grid-column:1/3}
.imgbox{background:#eef3fa;border:1px solid var(--line);border-radius:14px;height:110px;display:flex;align-items:center;justify-content:center;color:#8fa3bd;font-size:11px;background-size:cover;background-position:center}
.mapslot{background:linear-gradient(135deg,#e8f0e9,#dceadf);border:1px dashed #b9d4bd;border-radius:14px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4e7d5a;font-size:11px;gap:4px;margin-top:8px}
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmpwrap .ctable{min-width:640px}
.ctable td.diff{background:#fff7e0}
.ctable td.diff b,.ctable td.diff{color:#95600d;font-weight:700}
.diffhint{font-size:10px;color:#95600d;margin:4px 0 10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#eef5ff;color:#32669c;border-radius:999px;padding:3px 8px;font-size:10px}
.tag button{border:0;background:transparent;color:#32669c;font-size:11px;padding:0;cursor:pointer}
.remindrow{display:flex;gap:6px;align-items:center;justify-content:space-between}
.remindrow .btn{padding:6px 9px;font-size:11px}
textarea.imp{width:100%;border:1px solid #dfe6ef;border-radius:13px;padding:11px;font-size:11px;min-height:140px;font-family:ui-monospace,Consolas,monospace}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.qitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.qitem .rowtop{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <div><small>GLOBALSTUDY · MOBILE MVP</small><h1 id="title">学生 / 家长端</h1></div>
  <button class="switch" onclick="chooseRole()">切换角色</button>
</header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<section class="sheet" id="sheet">
  <div class="sheethead"><b id="sheetTitle">详情</b><button class="btn outline" onclick="closeSheet()">关闭</button></div>
  <div id="sheetBody" style="padding-top:12px"></div>
</section>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
let role = localStorage.getItem('gs-role') || 'student';
let page = 'home';
let data = null;          // /api/bootstrap payload
let results = [];         // current search results
let resultMeta = { total: 0, page: 1, pageSize: 10 };
let detailLoading = false;

const searchState = {
  q: '', country: '', city: '', stage: '', curriculum: '',
  district: '', language: '', institutionType: '',
  minFee: '', maxFee: '', scholarship: false, boarding: false,
  transitNear: false, sort: '', page: 1
};
const quickChips = [
  { id: 'intl', label: '国际学校', apply: () => { searchState.institutionType = 'international-school'; } },
  { id: 'ib', label: 'IB', apply: () => { searchState.curriculum = 'IB'; } },
  { id: 'cambridge', label: 'Cambridge', apply: () => { searchState.curriculum = 'Cambridge'; } },
  { id: 'lowfee', label: '学费较低', apply: () => { searchState.sort = 'fee_asc'; } },
  { id: 'scholarship', label: '有奖学金', apply: () => { searchState.scholarship = true; } },
  { id: 'boarding', label: '有住宿', apply: () => { searchState.boarding = true; } },
  { id: 'transit', label: '靠近公共交通', apply: () => { searchState.transitNear = true; } }
];
let activeChips = new Set();

const R = {
  student: { t: '学生 / 家长端', m: [['home','⌂','首页'],['programs','⌕','找学校'],['applications','◎','申请'],['profile','◉','我的']] },
  agency: { t: '机构工作台（B端）', m: [['home','⌂','工作台'],['programs','⌕','学校资源'],['clients','♙','客户'],['applications','◎','申请']] },
  supplier: { t: '院校 / 供应商', m: [['home','⌂','工作台'],['programs','▦','项目'],['applications','◎','受理'],['ads','◈','推广']] },
  admin: { t: '平台管理后台', m: [['home','⌂','总览'],['reviews','✓','数据审核'],['audits','✓','业务审核'],['applications','◎','申请'],['settlement','¥','结算']] }
};

const money = (n) => '¥' + Number(n || 0).toLocaleString('zh-CN');
const fmt = (n) => Number(n || 0).toLocaleString('zh-CN');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(u, o) {
  const opts = { headers: { 'Content-Type': 'application/json', ...(o && o.headers) }, ...o };
  const r = await fetch(u, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw Error(j.error || '请求失败');
  return j;
}

// V1.0 hash router: #/school/:id (detail page), #/compare (compare page).
function parseHash() {
  const h = location.hash || '';
  const m = h.match(/^#\/school\/([^/]+)/);
  if (m) return { type: 'school', id: decodeURIComponent(m[1]) };
  if (h === '#/compare') return { type: 'compare' };
  return null;
}

async function load() {
  data = (await api('/api/bootstrap')).data;
  render();
  if (page === 'programs') runSearch();
}

function nav(p) {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  page = p;
  if (p === 'programs' && (!results.length || !searchState._ran)) runSearch();
  render();
}
function setRole(r) { role = r; page = 'home'; localStorage.setItem('gs-role', r); closeSheet(); render(); }

function openSheet(t, h) {
  $('#sheetTitle').textContent = t;
  $('#sheetBody').innerHTML = h;
  $('#sheet').classList.add('on');
  $('#mask').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#mask').classList.remove('on'); }

function chooseRole() {
  openSheet('选择体验角色', '<div class="rolegrid">' + Object.entries(R).map(([k, v]) =>
    `<button class="role" onclick="setRole('${k}')"><b>${v.t}</b><span>${k==='student'?'找学校、建档、申请':k==='agency'?'客户、申请、协同':k==='supplier'?'项目、受理、推广':'审核、运营、结算'}</span></button>`).join('') + '</div>');
}

function metric(t, v) { return `<div class="metric"><small>${t}</small><b>${v}</b></div>`; }
function hero(t, d, cta, fn) { return `<section class="hero"><small>S2B2C GLOBAL STUDY</small><h2>${t}</h2><p>${d}</p><button class="btn white" onclick="${fn}">${cta}</button></section>`; }
function st(s) { return ['已录取','已通过'].some(x => String(s).includes(x)) ? 'good' : ['材料准备','待审核'].some(x => String(s).includes(x)) ? 'warn' : ''; }

// ---------------------------------------------------------------------------
// Reference lookups
// ---------------------------------------------------------------------------
const ref = () => data.reference || {};
const stageZh = (id) => { const s = ref().educationStages.find((x) => x.id === id); return s ? s.zh : id; };
const districtLabel = (id) => { const d = ref().districts.find((x) => x.id === id); return d ? (d.name_zh || d.name_en) : id; };
const cityLabel = (cityId) => { const c = ref().cities.find((x) => x.id === cityId); return c ? c.name_zh : ''; };
const locText = (s) => {
  const l = s.location || {};
  return [l.country_zh || l.country_en, l.city_zh || l.city_en, l.district_zh || l.district_en].filter(Boolean).join(' · ');
};
const tuitionText = (s) => `${s.currency} ${fmt(s.tuition_min)}–${fmt(s.tuition_max)}`;
const stationText = (s) => s.station ? `${s.station.name_zh || s.station.name_en}${s.station.line_code ? '（' + s.station.line_code + '）' : ''}` : '-';

// ---------------------------------------------------------------------------
// Search (API-driven, V0.5)
// ---------------------------------------------------------------------------
function buildQuery(toPage) {
  const s = searchState;
  const p = new URLSearchParams();
  if (s.q) p.set('q', s.q);
  if (s.country) p.set('country', s.country);
  if (s.city) p.set('city', s.city);
  if (s.stage) p.set('stage', s.stage);
  if (s.curriculum) p.set('curriculum', s.curriculum);
  if (s.district) p.set('district', s.district);
  if (s.language) p.set('language', s.language);
  if (s.institutionType) p.set('institutionType', s.institutionType);
  if (s.minFee !== '' && !Number.isNaN(Number(s.minFee))) p.set('minFee', s.minFee);
  if (s.maxFee !== '' && !Number.isNaN(Number(s.maxFee))) p.set('maxFee', s.maxFee);
  if (s.scholarship || s._negScholarship) p.set('scholarship', s._negScholarship ? 'false' : 'true');
  if (s.boarding || s._negBoarding) p.set('boarding', s._negBoarding ? 'false' : 'true');
  if (s.transitNear) p.set('transitNear', 'true');
  if (s.sort) p.set('sort', s.sort);
  p.set('page', String(toPage || s.page || 1));
  p.set('pageSize', '10');
  return p;
}

async function runSearch(toPage) {
  searchState.page = toPage || 1;
  try {
    const j = await api('/api/schools?' + buildQuery().toString());
    results = j.data || [];
    resultMeta = j.meta || resultMeta;
    searchState._ran = true;
    renderResults();
  } catch (e) { alert(e.message); }
}

function clearSearch() {
  Object.assign(searchState, { q:'', country:'', city:'', stage:'', curriculum:'', district:'', language:'', institutionType:'', minFee:'', maxFee:'', scholarship:false, boarding:false, transitNear:false, sort:'', page:1, _negBoarding:false, _negScholarship:false, _boardingSet:false, _scholarshipSet:false, favOnly:false });
  activeChips.clear();
  render();
  runSearch();
}

function toggleChip(id) {
  const chip = quickChips.find((c) => c.id === id);
  if (!chip) return;
  if (activeChips.has(id)) {
    activeChips.delete(id);
    if (id === 'intl') searchState.institutionType = '';
    if (id === 'ib' && searchState.curriculum === 'IB') searchState.curriculum = '';
    if (id === 'cambridge' && searchState.curriculum === 'Cambridge') searchState.curriculum = '';
    if (id === 'lowfee') searchState.sort = '';
    if (id === 'scholarship') { searchState.scholarship = false; searchState._negScholarship = false; searchState._scholarshipSet = false; }
    if (id === 'boarding') { searchState.boarding = false; searchState._negBoarding = false; searchState._boardingSet = false; }
    if (id === 'transit') searchState.transitNear = false;
  } else {
    activeChips.add(id);
    chip.apply();
  }
  syncForm();
  render();
  runSearch();
}

function searchChanged() { runSearch(); }
function qFieldChanged(key) {
  const id = key === 'q' ? '#q' : '#q' + key.charAt(0).toUpperCase() + key.slice(1);
  const el = document.querySelector(id);
  if (el) searchState[key] = el.value;
  runSearch();
}
// syncForm only picks up the free-text keyword input; selects write state via onchange.
function syncForm() {
  const el = document.querySelector('#q');
  if (el) searchState.q = el.value;
}

function advancedSheet() {
  syncForm();
  const r = ref();
  const cities = r.cities || [];
  const districtsByCity = cities.map((c) => ({ city: c, items: (r.districts || []).filter((d) => d.city_id === c.id) })).filter((g) => g.items.length);
  const curriculaByFamily = (r.curriculumFamilies || []).map((f) => ({ family: f, items: (r.curricula || []).filter((c) => c.family_id === f.id) })).filter((g) => g.items.length);
  const s = searchState;
  openSheet('高级筛选', `
    <div class="formgrid">
      <div class="full"><label class="field">区域（城市 / 行政区）</label>
        <select id="afDistrict"><option value="">全部区域</option>
          ${districtsByCity.map((g) => `<optgroup label="${esc(cityLabel(g.city.id))}">${g.items.map((d) => `<option value="${d.id}" ${s.district === d.id ? 'selected' : ''}>${d.name_zh || d.name_en} ${d.name_en && d.name_zh ? '· ' + d.name_en : ''}</option>`).join('')}</optgroup>`).join('')}
        </select></div>
      <div class="full"><label class="field">课程体系</label>
        <select id="afCurriculum"><option value="">全部课程</option>
          ${curriculaByFamily.map((g) => `<optgroup label="${esc(g.family.name_zh || g.family.name_en)}">${g.items.map((c) => `<option value="${esc(c.name_en)}" ${s.curriculum === c.name_en ? 'selected' : ''}>${esc(c.name_zh ? c.name_zh + ' · ' + c.name_en : c.name_en)}</option>`).join('')}</optgroup>`).join('')}
        </select></div>
      <div class="full"><label class="field">教学语言</label>
        <select id="afLanguage"><option value="">全部语言</option>
          ${(r.languages || []).map((l) => `<option value="${esc(l.name_en)}" ${s.language === l.name_en ? 'selected' : ''}>${esc(l.name_zh)} · ${esc(l.name_en)}</option>`).join('')}
        </select></div>
      <div><label class="field">最低学费</label><input id="afMinFee" type="number" inputmode="numeric" value="${esc(s.minFee)}" placeholder="不限"></div>
      <div><label class="field">最高学费</label><input id="afMaxFee" type="number" inputmode="numeric" value="${esc(s.maxFee)}" placeholder="不限"></div>
      <div class="full"><label class="field">学校类型</label>
        <select id="afType"><option value="">全部类型</option>
          ${(r.institutionTypes || []).map((t) => `<option value="${t.id}" ${s.institutionType === t.id ? 'selected' : ''}>${esc(t.name_zh)} · ${esc(t.name_en)}</option>`).join('')}
        </select></div>
      <div><label class="field">住宿</label><select id="afBoarding"><option value="">不限</option><option value="1" ${s.boarding ? 'selected' : ''}>有住宿</option><option value="0" ${!s.boarding && s._boardingSet ? 'selected' : ''}>无住宿</option></select></div>
      <div><label class="field">奖学金</label><select id="afScholarship"><option value="">不限</option><option value="1" ${s.scholarship ? 'selected' : ''}>有奖学金</option><option value="0" ${!s.scholarship && s._scholarshipSet ? 'selected' : ''}>无奖学金</option></select></div>
    </div>
    <div class="actions"><button class="btn outline" onclick="applyAdvancedReset()">重置</button><button class="btn primary" onclick="applyAdvanced()">应用筛选</button></div>
  `);
}

function applyAdvanced() {
  const g = (id) => { const el = document.querySelector('#' + id); return el ? el.value : ''; };
  searchState.district = g('afDistrict');
  searchState.curriculum = g('afCurriculum');
  searchState.language = g('afLanguage');
  searchState.minFee = g('afMinFee');
  searchState.maxFee = g('afMaxFee');
  searchState.institutionType = g('afType');
  const b = g('afBoarding'), sc = g('afScholarship');
  searchState.boarding = b === '1' ? true : b === '0' ? false : false;
  searchState._boardingSet = b !== '';
  searchState.scholarship = sc === '1';
  searchState._scholarshipSet = sc !== '';
  if (b === '0' || sc === '0') {
    // negative filters are API-supported; send explicit false via flags
    searchState._negBoarding = b === '0';
    searchState._negScholarship = sc === '0';
  } else { searchState._negBoarding = false; searchState._negScholarship = false; }
  closeSheet();
  runSearch();
}
function applyAdvancedReset() {
  Object.assign(searchState, { district:'', language:'', minFee:'', maxFee:'', institutionType:'', _negBoarding:false, _negScholarship:false });
  closeSheet();
  render();
  runSearch();
}

function favs() { return JSON.parse(localStorage.getItem('gs-favs') || '[]'); }

}

function schoolCards(list) { return '<div class="cards">' + list.map(schoolCard).join('') + '</div>'; }

function renderResults() {
  const host = document.querySelector('#plist');
  if (!host) return;
  const favOnly = searchState.favOnly;
  const shown = favOnly ? results.filter((x) => favs().includes(x.id)) : results;
  const count = document.querySelector('#resultCount');
  if (count) count.innerHTML = `${favOnly ? '收藏 ' + shown.length + ' 所 / ' : ''}${resultMeta.total} 所 · 第 ${resultMeta.page} 页`;
  host.innerHTML = shown.length
    ? schoolCards(shown) + pagerHtml()
    : '<div class="notice">没有匹配的学校，试试放宽筛选条件。</div>';
}

function pagerHtml() {
  const totalPages = Math.max(1, Math.ceil(resultMeta.total / resultMeta.pageSize));
  return `<div class="pager">
    <button class="btn outline" ${resultMeta.page <= 1 ? 'disabled' : ''} onclick="runSearch(${resultMeta.page - 1})">上一页</button>
    <span class="muted">${resultMeta.page} / ${totalPages}</span>
    <button class="btn outline" ${resultMeta.page >= totalPages ? 'disabled' : ''} onclick="runSearch(${resultMeta.page + 1})">下一页</button>
  </div>`;
}

// --- V1.0: favourites with school+program support & reminders (localStorage) ---
function favs() { return JSON.parse(localStorage.getItem('gs-favs') || '[]'); }
function compares() { return JSON.parse(localStorage.getItem('gs-compares') || '[]'); }
function favProgs() { return JSON.parse(localStorage.getItem('gs-fav-programs') || '[]'); }
function reminders() { return JSON.parse(localStorage.getItem('gs-reminders') || '[]'); }

function toggleFav(id) {
  let v = favs();
  const i = v.indexOf(id);
  if (i >= 0) v.splice(i, 1); else v.push(id);
  localStorage.setItem('gs-favs', JSON.stringify(v));
  renderResults();
  if (page === 'home' || page === 'profile') render();
}

function toggleFavProgram(pid) {
  let v = favProgs();
  const i = v.indexOf(pid);
  if (i >= 0) v.splice(i, 1); else v.push(pid);
  localStorage.setItem('gs-fav-programs', JSON.stringify(v));
  if (page === 'school') renderSchoolDetailPage(currentSchoolId);
}

// Reminder structure: { id, kind: 'deadline'|'start'|'scholarship', title, date, schoolId }
function setReminder(kind, title, date, schoolId) {
  if (!date) { alert('该数据暂无日期，无法设置提醒'); return; }
  let v = reminders();
  const existing = v.find((r) => r.kind === kind && r.schoolId === schoolId);
  if (existing) { alert('已设置过该提醒，可在「我的」页查看'); return; }
  v.push({ id: 'R-' + Date.now().toString(36), kind, title, date, schoolId, createdAt: new Date().toISOString().slice(0, 10) });
  localStorage.setItem('gs-reminders', JSON.stringify(v));
  alert('已设置提醒（站内）：' + title + ' · ' + date);
}
function removeReminder(id) {
  let v = reminders().filter((r) => r.id !== id);
  localStorage.setItem('gs-reminders', JSON.stringify(v));
  render();
}
function remindItemHtml(r) {
  const school = (data.schools || []).find((s) => s.id === r.schoolId);
  const kindLabel = { deadline: '申请截止', start: '开学', scholarship: '奖学金截止' }[r.kind] || '提醒';
  return `<div class="row"><div class="rowtop"><div><h4>${esc(r.title)}</h4><div class="muted">${esc(kindLabel)} · ${esc(r.date)}${school ? ' · ' + esc(school.name_zh) : ''}</div></div><button class="btn outline" style="padding:6px 10px" onclick="removeReminder('${r.id}')">删除</button></div></div>`;
}

function toggleCompare(id) {
  let v = compares();
  const i = v.indexOf(id);
  if (i >= 0) { v.splice(i, 1); }
  else {
    if (v.length >= 4) { alert('最多同时对比 4 所学校'); return; }
    v.push(id);
  }
  localStorage.setItem('gs-compares', JSON.stringify(v));
  renderResults();
  if (v.length) location.hash = '#/compare';
  else if (page === 'programs') render();
}

function clearCompare() {
  localStorage.setItem('gs-compares', '[]');
  location.hash = '';
  nav('programs');
}

// V1.0 compare page: horizontal scroll on mobile + difference highlighting.
async function comparePage() {
  const ids = compares();
  if (!ids.length) return `<div class="backbar"><button onclick="nav('programs')">← 返回</button></div><div class="notice">还没有选择学校。在结果卡片上点击「对比」加入，最多 4 所。</div>`;
  let list = [];
  try {
    const j = await api('/api/compare?ids=' + ids.map(encodeURIComponent).join(','));
    list = j.data || [];
  } catch (e) { return `<div class="backbar"><button onclick="nav('programs')">← 返回</button></div><div class="notice">${esc(e.message)}</div>`; }
  if (!list.length) return `<div class="backbar"><button onclick="nav('programs')">← 返回</button></div><div class="notice">所选学校均不可用，请重新选择。</div>`;

  const VALUES = [
    { label: '国家/城市/区域', fn: (s) => locText(s) },
    { label: '教育阶段', fn: (s) => (s.stages || []).map(stageZh).join('、') },
    { label: '课程体系', fn: (s) => (s.curricula || []).join('、') },
    { label: '教学语言', fn: (s) => s.main_language || '-' },
    { label: '学费区间', fn: (s) => tuitionText(s) },
    { label: '奖学金', fn: (s) => (s.scholarships ? '有' : '暂无') },
    { label: '住宿', fn: (s) => (s.boarding ? '有' : '无') },
    { label: '最近交通', fn: (s) => stationText(s) },
    { label: '学校类型', fn: (s) => s.institution_type || '-' },
  ];
  const row = (label, fns) => {
    const cells = list.map((s) => {
      const v = fns(s);
      const diffs = list.filter((o) => o.id !== s.id).map((o) => String(fns(o)));
      const isDiff = diffs.some((d) => d !== String(v));
      return `<td class="${isDiff ? 'diff' : ''}">${esc(String(v))}</td>`;
    });
    return `<tr><th>${label}</th>${cells.join('')}</tr>`;
  };
  return `
    <div class="backbar"><button onclick="nav('programs')">← 返回</button><b style="font-size:15px">学校对比（${list.length}/4）</b></div>
    <div class="diffhint">高亮项为各校之间的差异项；向左滑动查看全部列。</div>
    <div class="cmpwrap"><table class="ctable">
      <tr><th>学校</th>${list.map((s) => `<td><b>${esc(s.name_zh)}</b><br><span class="muted">${esc(s.name_en || '')}</span><br><span class="status ${s.is_demo ? 'warn' : 'good'}">${s.is_demo ? '演示' : '已验证'}</span></td>`).join('')}</tr>
      ${VALUES.map((r) => row(r.label, r.fn)).join('')}
    </table></div>
    <div class="actions" style="margin-top:12px"><button class="btn danger" onclick="clearCompare()">清空对比</button><button class="btn outline" onclick="nav('programs')">继续浏览</button></div>
  `;
}

// Pull the structured map payload for a school and list its nearest stations.
// tile_provider stays null server-side, so we never pretend a map is rendered.
async function loadMapArea(id) {
  if (!id) return;
  const slot = document.getElementById('mapslot-' + id);
  if (!slot) return;
  try {
    const j = await api('/api/map/' + encodeURIComponent(id) + '?maxStations=5');
    const d = j.data;
    if (!d.renderable) {
      slot.textContent = '🗺 ' + (d.note || '暂无坐标，无法渲染地图');
      return;
    }
    const rows = (d.stations || []).map((s) =>
      `<div class="kv"><span>${esc(s.name_zh || s.name_en)}${s.line && s.line.code ? ' <span class="tag">' + esc(s.line.code) + '</span>' : ''}</span><b>${esc(s.distance_label)}</b></div>`
    ).join('');
    slot.innerHTML = `<div style="width:100%"><div style="font-weight:700;margin-bottom:4px">🗺 最近 ${(d.stations || []).length} 个站点</div>${rows || '<div class="muted">附近暂无站点数据</div>'}<div class="muted" style="margin-top:6px">${esc(d.note || '')}</div></div>`;
    slot.style.height = 'auto';
  } catch (e) {
    slot.textContent = '🗺 地图数据加载失败';
  }
}

function renderFilterTags() {

function activeFilterTags() {
  const s = searchState;
  const tags = [];
  const add = (label, key, clearFn) => tags.push({ label, key, clearFn });
  if (s.country) add(countryName(s.country), 'country', "searchState.country='';render();runSearch()");
  if (s.city) add(cityLabel(s.city), 'city', "searchState.city='';render();runSearch()");
  if (s.district) add(districtLabel(s.district), 'district', "searchState.district='';render();runSearch()");
  if (s.stage) add(stageZh(s.stage), 'stage', "searchState.stage='';render();runSearch()");
  if (s.curriculum) add(s.curriculum, 'curriculum', "searchState.curriculum='';render();runSearch()");
  if (s.language) add(s.language, 'language', "searchState.language='';render();runSearch()");
  if (s.institutionType) add(s.institutionType, 'type', "searchState.institutionType='';render();runSearch()");
  if (s.minFee !== '') add('学费≥' + s.minFee, 'minFee', "searchState.minFee='';render();runSearch()");
  if (s.maxFee !== '') add('学费≤' + s.maxFee, 'maxFee', "searchState.maxFee='';render();runSearch()");
  if (s.scholarship) add('有奖学金', 'scholarship', "searchState.scholarship=false;searchState._negScholarship=false;render();runSearch()");
  if (s._negScholarship) add('无奖学金', 'scholarship', "searchState._negScholarship=false;render();runSearch()");
  if (s.boarding) add('有住宿', 'boarding', "searchState.boarding=false;searchState._negBoarding=false;render();runSearch()");
  if (s._negBoarding) add('无住宿', 'boarding', "searchState._negBoarding=false;render();runSearch()");
  if (s.transitNear) add('靠近公共交通', 'transit', "searchState.transitNear=false;render();runSearch()");
  if (s.sort === 'fee_asc') add('学费从低到高', 'sort', "searchState.sort='';render();runSearch()");
  if (s.sort === 'fee_desc') add('学费从高到低', 'sort', "searchState.sort='';render();runSearch()");
  return tags;
}

// --- B2B (agency) school resource search ---
let b2bResults = [];
let b2bMeta = { total: 0, page: 1, pageSize: 10 };
const b2bState = { q: '', country: '', city: '', stage: '', curriculum: '', acceptsAgents: false, hasCommission: false, page: 1, tab: 'schools' };

async function b2bSearch(toPage) {
  b2bState.page = toPage || 1;
  const isPrograms = b2bState.tab === 'programs';
  try {
    const p = new URLSearchParams();
    if (b2bState.q) p.set('q', b2bState.q);
    if (b2bState.country) p.set('country', b2bState.country);
    if (b2bState.city) p.set('city', b2bState.city);
    if (b2bState.stage) p.set('stage', b2bState.stage);
    if (b2bState.curriculum) p.set('curriculum', b2bState.curriculum);
    if (b2bState.acceptsAgents) p.set('acceptsAgents', 'true');
    if (b2bState.hasCommission) p.set('hasCommission', 'true');
    p.set('page', String(b2bState.page));
    p.set('pageSize', '10');
    const url = isPrograms ? '/api/b2b/programs?' + p.toString() : '/api/b2b/schools?' + p.toString();
    const j = await api(url, { headers: { 'x-role': 'agency' } });
    b2bResults = j.data || [];
    b2bMeta = j.meta || b2bMeta;
    renderB2bResults();
  } catch (e) {
    const host = document.querySelector('#b2blist');
    if (host) host.innerHTML = `<div class="notice">加载失败：${esc(e.message)}</div>`;
  }
}

  host.innerHTML = b2bResults.length
    ? '<div class="cards">' + b2bResults.map(isPrograms ? b2bProgramCard : b2bCard).join('') + '</div>'
    : `<div class="notice">${empty}</div>`;
}

function b2bPage() {
  const r = ref();
  const s = b2bState;
  return `
    <div class="notice">B端学校资源库：招生阶段、代理接受度、合作状态。佣金字段只在后台明确录入真实代理协议后展示，平台绝不自动生成佣金。</div>
    <div class="search" style="margin-top:10px"><input id="b2bq" placeholder="学校 / 课程关键词" value="${esc(s.q)}" oninput="b2bState.q=this.value">
      <select onchange="b2bState.country=this.value"><option value="">全部国家</option>${r.countries.map((c) => `<option value="${c.id}" ${s.country === c.id ? 'selected' : ''}>${esc(c.name_zh)}</option>`).join('')}</select></div>
    <div class="search"><select onchange="b2bState.city=this.value"><option value="">全部城市</option>${r.cities.filter((c) => !s.country || c.country_id === s.country).map((c) => `<option value="${c.id}" ${s.city === c.id ? 'selected' : ''}>${esc(c.name_zh || c.name_en)}</option>`).join('')}</select>
      <select onchange="b2bState.stage=this.value"><option value="">全部阶段</option>${r.educationStages.map((x) => `<option value="${x.id}" ${s.stage === x.id ? 'selected' : ''}>${esc(x.zh)}</option>`).join('')}</select></div>
    <div class="quick"><button class="chip ${s.acceptsAgents ? 'on' : ''}" onclick="b2bState.acceptsAgents=!b2bState.acceptsAgents;b2bSearch()">接受代理</button>
      <button class="chip ${s.hasCommission ? 'on' : ''}" onclick="b2bState.hasCommission=!b2bState.hasCommission;b2bSearch()">有佣金协议</button>
      <button class="chip" onclick="b2bSearch()">搜索</button></div>
    <div class="quick"><button class="chip ${s.tab === 'schools' ? 'on' : ''}" onclick="b2bState.tab='schools';b2bSearch()">学校资源</button>
      <button class="chip ${s.tab === 'programs' ? 'on' : ''}" onclick="b2bState.tab='programs';b2bSearch()">Program 列表</button></div>
    <div class="section"><h3>${s.tab === 'programs' ? 'Program 列表' : '学校资源'}</h3><span id="b2bCount">加载中…</span></div>
    <div id="b2blist"><div class="notice">正在加载…</div></div>
  `;
}

// --- Admin: data review queue + import tool ---
let queueItems = [];
function adminReviewsPage() {
  return `
    <div class="section"><h3>数据审核队列</h3><span id="qCount">加载中…</span></div>
    <div id="qlist"><div class="notice">正在加载…</div></div>
    <div class="section"><h3>真实数据导入</h3><span>CSV / JSON</span></div>
    <div class="notice" style="margin-bottom:8px">导入规则：每条真实学校必须含 name / country / city 与 source_url（或 supplier_evidence）；缺少来源的数据不得标记 verified；重复学校自动检测。</div>
    <textarea class="imp" id="impContent" placeholder="粘贴 CSV 或 JSON（数组）数据…"></textarea>
    <div class="actions"><button class="btn outline" onclick="impPreview()">预览校验</button><button class="btn primary" onclick="impCommit()">批量导入</button></div>
    <div id="impResult"></div>
  `;
}
async function loadQueue() {
  try {
    const j = await api('/api/admin/queue', { headers: { 'x-role': 'admin' } });
    queueItems = j.data || [];
    const c = document.querySelector('#qCount');
    if (c) c.textContent = `${queueItems.length} 项`;
    const host = document.querySelector('#qlist');
    if (!host) return;
    host.innerHTML = queueItems.length ? queueItems.map(qItemHtml).join('') : '<div class="notice">队列为空。导入数据后在这里审核。</div>';
  } catch (e) {
    const host = document.querySelector('#qlist');
    if (host) host.innerHTML = `<div class="notice">${esc(e.message)}</div>`;
  }
}
function qItemHtml(item) {
  const s = item.school;
  const revs = item.revisions || [];
  const latest = revs.slice(-3).reverse();
  return `<div class="qitem">
    <div class="rowtop"><div><h4>${s ? esc(s.name_zh || s.name) : esc(item.school_id)}</h4><div class="muted">${s ? esc(locText(s)) : ''} · 状态：${esc(item.status)}</div></div>
      <span class="status ${item.status === 'verified' ? 'good' : 'warn'}">${esc(item.status)}</span></div>
    ${s && s.source_url ? `<div class="muted">来源：<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_url)}</a></div>` : `<div class="muted">来源：${s && s.supplier_evidence ? esc(s.supplier_evidence) : '无'}</div>`}
    ${revs.length ? `<div class="muted" style="margin-top:6px">最近修订：<br>${latest.map((r) => `${esc(r.field)}: ${esc(String(r.old))} → ${esc(String(r.new))}`).join('<br>')}</div>` : ''}
    <div class="actions">
      ${item.status === 'draft' ? `<button class="btn outline" onclick="queueAction('${item.school_id}','submit')">提交审核</button>` : ''}
      ${item.status === 'pending' ? `<button class="btn success" onclick="queueAction('${item.school_id}','approve')">通过</button><button class="btn danger" onclick="queueAction('${item.school_id}','reject')">驳回</button><button class="btn outline" onclick="queueAction('${item.school_id}','request-info')">要求补资料</button>` : ''}
      ${(item.status === 'verified' || item.status === 'pending') ? `<button class="btn outline" onclick="queueAction('${item.school_id}','expire')">标记过期</button>` : ''}
      <button class="btn outline" onclick="showRevisions('${item.school_id}')">历史</button>
    </div>
  </div>`;
}
async function queueAction(schoolId, action) {
  try {
    await api('/api/admin/queue/' + encodeURIComponent(schoolId) + '/action', {
      method: 'POST',
      headers: { 'x-role': 'admin' },
      body: JSON.stringify({ action })
    });
    await loadQueue();
  } catch (e) { alert(e.message); }
}
async function showRevisions(schoolId) {
  try {
    const j = await api('/api/admin/schools/' + encodeURIComponent(schoolId) + '/revisions', { headers: { 'x-role': 'admin' } });
    const d = j.data;
    openSheet('修订历史 · ' + schoolId, `
      <div class="section"><h3>状态流转</h3></div>
      ${(d.history || []).map((h) => `<div class="muted" style="margin:4px 0">${esc(h.at)} · ${esc(h.status)} · ${esc(h.note || '')}</div>`).join('')}
      <div class="section"><h3>字段修订</h3></div>
      ${(d.revisions || []).length ? (d.revisions || []).map((r) => `<div class="split"><span>${esc(r.field)} · ${esc(r.at)}</span><b>${esc(String(r.old))} → ${esc(String(r.new))}</b></div>`).join('') : '<div class="notice">暂无字段修订记录</div>'}`);
  } catch (e) { openSheet('修订历史', `<div class="notice">${esc(e.message)}</div>`); }
}
async function impPreview() {
  const content = document.querySelector('#impContent').value;
  const host = document.querySelector('#impResult');
  if (!content.trim()) { host.innerHTML = '<div class="notice">请先粘贴数据</div>'; return; }
  host.innerHTML = '<div class="notice">校验中…</div>';
  try {
    const j = await api('/api/admin/import/preview', { method: 'POST', headers: { 'x-role': 'admin' }, body: JSON.stringify({ content }) });
    const d = j.data;
    host.innerHTML = `
      <div class="notice" style="margin:8px 0">共 ${d.total} 行：可导入 ${d.importable} · 无效 ${d.invalid} · 疑似重复 ${d.duplicates}</div>
      ${(d.preview || []).map((p) => `<div class="qitem"><div class="rowtop"><div><h4>${esc(p.name)}</h4><div class="muted">${esc(p.country_id)} · ${esc(p.city_id)} · 来源:${p.source_url ? '有' : '无'} · 状态:${esc(p.verified_status)}</div></div><span class="status ${p.verified_status === 'verified' ? 'good' : 'warn'}">${esc(p.verified_status)}</span></div></div>`).join('')}
      ${(d.report || []).filter((r) => !r.ok).map((r) => `<div class="notice" style="border-color:#f0dcb0;background:#fff9ee;margin:4px 0">第 ${r.row} 行：${r.errors.map(esc).join('；')}${r.warnings.length ? '<br>警告：' + r.warnings.map(esc).join('；') : ''}</div>`).join('')}
    `;
  } catch (e) { host.innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}
async function impCommit() {
  const content = document.querySelector('#impContent').value;
  const host = document.querySelector('#impResult');
  if (!content.trim()) { host.innerHTML = '<div class="notice">请先粘贴数据</div>'; return; }
  host.innerHTML = '<div class="notice">导入中…</div>';
  try {
    const j = await api('/api/admin/import/commit', { method: 'POST', headers: { 'x-role': 'admin' }, body: JSON.stringify({ content }) });
    const d = j.data;
    host.innerHTML = `<div class="notice">导入完成：成功 ${d.committed} 条（进入 draft 审核队列），跳过 ${d.skipped} 条。</div>`;
    await loadQueue();
    await load();
  } catch (e) { host.innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

function render() {
  const cfg = R[role];
  $('#title').textContent = cfg.t;
  $('#nav').innerHTML = cfg.m.map((m) => `<button class="${page === m[0] ? 'on' : ''}" onclick="nav('${m[0]}')"><b>${m[1]}</b>${m[2]}</button>`).join('');
  const hash = parseHash();
  if (hash && hash.type === 'school') {
    $('#view').innerHTML = '<div class="notice">加载中…</div>';
    renderSchoolDetailPage(hash.id);
    return;
  }
  if (hash && hash.type === 'compare') {
    $('#view').innerHTML = '<div class="notice">加载中…</div>';
    comparePage().then((html) => { $('#view').innerHTML = html; });
    return;
  }
  if (location.hash) { location.hash = ''; return; }
  $('#view').innerHTML = content();
  if (page === 'programs' && searchState._ran && role !== 'agency') renderResults();
  if (page === 'programs' && role === 'agency') { b2bSearch(); }
  if (page === 'reviews') { loadQueue(); }
}

window.addEventListener('hashchange', () => {
  if (parseHash()) render();
  else if (!location.hash) render();
});


function appDetail(id) {
  const a = (data.applications || []).find((x) => x.id === id);
  if (!a) return;
  openSheet('申请 ' + id, `<h3>${esc(a.student)}</h3><div class="notice">${esc(a.agency)} → ${esc(a.school)}</div><div class="timeline"><div class="ti"><b>建立申请</b><span class="muted">档案已关联</span></div><div class="ti"><b>材料准备</b><span class="muted">当前：${esc(a.status)}</span></div><div class="ti"><b>院校受理 / 补件</b></div><div class="ti"><b>录取 / 奖学金</b></div><div class="ti"><b>入学 / 结算</b></div></div>${role === 'supplier' && a.status === '院校受理' ? `<div class="actions"><button class="btn outline" onclick="upd('${id}','补件中')">要求补件</button><button class="btn success" onclick="upd('${id}','已录取')">录取演示</button></div>` : ''}`);
}
async function upd(id, s) {
  await api('/api/applications/' + id, { method: 'PATCH', body: JSON.stringify({ status: s, progress: s === '已录取' ? 88 : 65 }) });
  data = (await api('/api/bootstrap')).data;
  closeSheet(); render();
}
function clientForm() {
  openSheet('新增客户', '<div class="notice">顾问可代建档，也可邀请学生自行建档。</div><p><input id="cn" placeholder="学生姓名"></p><p><select id="co"><option>王老师</option><option>周老师</option></select></p><button class="btn primary" style="width:100%" onclick="createClient()">创建客户</button>');
}
async function createClient() {
  const name = $('#cn').value.trim();
  if (!name) return;
  await api('/api/clients', { method: 'POST', body: JSON.stringify({ name, owner: $('#co').value }) });
  data = (await api('/api/bootstrap')).data;
  closeSheet(); page = 'clients'; render();
}
async function approve(id) {
  await api('/api/audits/' + id, { method: 'PATCH', body: JSON.stringify({ status: '已通过' }) });
  data = (await api('/api/bootstrap')).data;
  render();
}

load();
</script>
</body>
</html>
