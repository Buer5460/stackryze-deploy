<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Action Mini</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#edf2ff;margin:0}main{max-width:760px;margin:48px auto;padding:24px}.card{background:#121a31;border:1px solid #263250;border-radius:20px;padding:24px;box-shadow:0 16px 60px #0005}h1{font-size:34px;margin:0 0 8px}.muted{color:#9fb0d5}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;background:#0d1428;border:1px solid #304061;color:white;padding:14px;border-radius:12px;margin:8px 0}button{background:#fff;color:#0b1020;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#1a2442;color:#cfe0ff}.out{white-space:pre-wrap;background:#09101f;padding:16px;border-radius:12px;margin-top:16px;min-height:100px}.good{color:#74f0b1}</style></head><body><main><div class="card"><h1>AI Action Mini</h1><p class="muted">iPhone 13 + Siri/快捷指令 + Universal Action MVP</p><p id="health">正在检查服务…</p><label>APP_TOKEN</label><input id="token" placeholder="部署后填写 APP_TOKEN"><label>测试命令</label><textarea id="text" rows="3">找出最近一个月流水下降30%以上的商户</textarea><div class="row"><button onclick="run()">运行</button><button class="chip" onclick="setText('明天下午3点提醒我联系张总')">提醒测试</button><button class="chip" onclick="setText('给前三家建立跟进任务')">跟进测试</button></div><div id="out" class="out">等待测试…</div></div></main><script>const $=id=>document.getElementById(id); function setText(t){$('text').value=t} fetch('/api/health').then(r=>r.json()).then(x=>$('health').innerHTML='<span class="good">● 服务在线</span> · v'+x.version).catch(()=>$('health').textContent='服务异常'); async function run(){const r=await fetch('/api/v1/command',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify({text:$('text').value,channel:'web',user:'owner',conversationId:'demo'})}); const x=await r.json(); $('out').textContent=JSON.stringify(x,null,2)}</script></body></html>
