<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>GlobalStudy — 学生 / 家长端</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-audience="C">
<div class="phone" id="app">
  <noscript><header class="header"><a class="brand" href="/"><div class="logo">G</div><div><b>GlobalStudy</b><small>GlobalStudy</small></div></a><div class="header-actions"><span class="lang-btn">English</span><a class="pill" href="/">切换客户端</a></div></header><main class="section"><div class="notice">请启用 JavaScript 以使用本客户端 / Please enable JavaScript.</div></main><footer class="footer">GlobalStudy · 由安世达教育提供核心动力<span class="footer-powered">Powered by Aethel Edu</span></footer></noscript>
</div>
<div class="drawer-mask" id="mask" onclick="GS.closeDrawer()"></div>
<section class="drawer" id="drawer"><div class="handle"></div>
  <div class="drawer-head"><b id="drawerTitle">详情</b><button id="drawerClose" onclick="GS.closeDrawer()">关闭</button></div>
  <div id="drawerBody"></div></section>

<script src="/js/gs.js"></script>
<script>
var TAB_NAMES = ['Home', 'Discover', 'Apply', 'Service', 'Me'];
var tab = 'home';
var me = null;
var caps = null;
var state = {
  schools: [], suppliers: [], recommendations: [], applications: [],
  documents: [], payments: [], messages: [], todos: [], brief: null
};

function tabs() {
  var zh = GS.lang === 'zh';
  return [
    { key: 'Home', icon: '⌂', label: zh ? '首页' : 'Home' },
    { key: 'Discover', icon: '⌕', label: zh ? '发现' : 'Discover' },
    { key: 'Apply', icon: '◎', label: zh ? '申请' : 'Apply' },
    { key: 'Service', icon: '☰', label: zh ? '服务' : 'Services' },
    { key: 'Me', icon: '☺', label: zh ? '我的' : 'Me' }
  ];
}

function renderShell() {
  var zh = GS.lang === 'zh';
  var items = tabs();
  var active = items.filter(function (i) { return i.key.toLowerCase() === tab; })[0] || items[0];
  var bound = me && me.c_profile && me.c_profile.binding_state === 'active';
  var hero = {
    Home: {
      eyebrow: zh ? '学生端 · 在线演示' : 'STUDENT CLIENT · LIVE DEMO',
      title: (zh ? '你好' : 'Hello') + (me && me.user ? '，' + me.user.display_name : ''),
      lead: bound ? (zh ? '已绑定服务机构，完整服务已开启。' : 'Your agency is bound — full service is enabled.')
        : (zh ? '请绑定服务机构后激活完整服务。' : 'Bind a service agency to activate full service.')
    },
    Discover: { eyebrow: zh ? '发现' : 'DISCOVER', title: zh ? '找学校与教育服务' : 'Find schools and services', lead: zh ? '按国家、学段、课程与费用搜索，支持收藏与对比。' : 'Search by country, stage, curriculum and fee.' },
    Apply: { eyebrow: zh ? '申请中心' : 'APPLICATIONS', title: zh ? 'S0–S10 申请状态机' : 'The S0–S10 application machine', lead: zh ? '每个阶段都有负责人、待办、材料与审计记录。' : 'Every stage has an owner, todos, documents and an audit trail.' },
    Service: { eyebrow: zh ? '服务中心' : 'SERVICES', title: zh ? '住宿 / 体检 / 认证 / 签证' : 'Accommodation / Medical / Certification / Visa', lead: zh ? '绑定后即可自主选择、购买与支付。' : 'Once bound you can choose, buy and pay by yourself.' },
    Me: { eyebrow: zh ? '我的' : 'ACCOUNT', title: zh ? '档案、支付与消息' : 'Profile, payments and messages', lead: zh ? '支付走 AETHEL X Sandbox，不涉及真实资金。' : 'Payments run through the AETHEL X sandbox — no real funds.' }
  }[active.key] || {};

  document.getElementById('app').innerHTML = GS.shell({
    title: 'GlobalStudy',
    subtitle: zh ? '学生 / 家长端' : 'Student / Parent',
    eyebrow: hero.eyebrow, headline: hero.title, lead: hero.lead,
    tabs: items.map(function (i) { return { key: i.key, label: i.label, icon: i.icon, active: i.key.toLowerCase() === tab }; })
  });

  if (!bound) {
    document.getElementById('main').insertAdjacentHTML('afterbegin',
      '<div class="banner warn">' + GS.esc(zh
        ? '当前为待绑定状态：可浏览公开信息、查看费用与提交需求；下单、付款、上传材料需绑定服务机构。'
        : 'You are unbound: browse public information, view fees and submit a requirement. Ordering, paying and uploading documents require a bound agency.') + '</div>');
  }
  renderTab(tab);
}

window.renderTab = function (name) {
  tab = name;
  var main = document.getElementById('main');
  if (!main) return;
  try {
    if (name === 'home') renderHome(main);
    else if (name === 'discover') renderDiscover(main);
    else if (name === 'apply') renderApply(main);
    else if (name === 'service') renderService(main);
    else renderMe(main);
  } catch (e) { main.innerHTML = GS.errorState(e.message); }
};

function renderHome(main) {
  var zh = GS.lang === 'zh';
  var bound = caps && caps.bound;
  main.innerHTML = '<section class="section">' + GS.metrics([
    [zh ? '申请' : 'Applications', state.applications.length],
    [zh ? '待办' : 'Todos', state.todos.filter(function (t) { return t.status !== 'done'; }).length],
    [zh ? '材料' : 'Documents', state.documents.length],
    [zh ? '支付' : 'Payments', state.payments.length]
  ]) +
    (bound
      ? GS.sectionHead(zh ? '我的服务机构' : 'My agency', '') + '<div id="myB"></div>'
      : GS.sectionHead(zh ? '下一步' : 'Next step', '') +
        '<div class="banner info">' + GS.esc(zh ? '提交留学需求，系统会按 Level 2 优先规则推荐 3–5 家服务机构。' : 'Submit a requirement and the platform recommends 3–5 agencies with Level 2 priority.') + '</div>' +
        '<button class="btn primary wide" onclick="submitRequirementFlow()">' + GS.esc(zh ? '提交需求并获取推荐' : 'Submit a requirement') + '</button>') +
    GS.sectionHead(zh ? '每日简报' : 'Daily brief', '') + '<div id="briefBox">' + GS.esc(GS.t('loading')) + '</div>' +
    '</section>';
  if (bound) loadMyB();
  loadBrief();
}

var discoverMode = 'schools';
function renderDiscover(main) {
  var zh = GS.lang === 'zh';
  var labels = { schools: zh ? '学校' : 'Schools', suppliers: zh ? '教育服务' : 'Services', accommodation: zh ? '住宿' : 'Accommodation' };
  main.innerHTML = '<section class="section">' +
    '<div class="subtabs">' + Object.keys(labels).map(function (k) {
      return '<button id="sub-' + k + '" onclick="setDiscover(\'' + k + '\')">' + labels[k] + '</button>';
    }).join('') + '</div>' +
    '<div class="search"><input id="q" class="wide" placeholder="' + GS.esc(zh ? '学校、地区或课程体系' : 'School, area or curriculum') + '">' +
    '<select id="country"></select><select id="stage"></select>' +
    '<button class="btn primary wide" onclick="runDiscoverSearch()">' + GS.esc(GS.t('search')) + '</button></div>' +
    '<div class="section-head"><h2 id="discoverTitle">' + labels.schools + '</h2><span id="discoverCount">—</span></div>' +
    '<div id="discoverList" class="list">' + GS.emptyState(GS.t('loading')) + '</div></section>';
  setDiscover('schools');
}

function setDiscover(mode) {
  discoverMode = mode;
  var zh = GS.lang === 'zh';
  var labels = { schools: zh ? '学校' : 'Schools', suppliers: zh ? '教育服务' : 'Services', accommodation: zh ? '住宿' : 'Accommodation' };
  ['schools', 'suppliers', 'accommodation'].forEach(function (k) {
    var el = document.getElementById('sub-' + k);
    if (el) el.classList.toggle('active', k === mode);
  });
  var title = document.getElementById('discoverTitle');
  if (title) title.textContent = labels[mode];
  runDiscoverSearch();
}

async function runDiscoverSearch() {
  var zh = GS.lang === 'zh';
  var box = document.getElementById('discoverList');
  if (!box) return;
  box.innerHTML = GS.emptyState(GS.t('loading'));
  try {
    var q = (document.getElementById('q') || {}).value || '';
    var country = (document.getElementById('country') || {}).value || '';
    var items = [];
    var count = 0;
    if (discoverMode === 'schools') {
      var params = new URLSearchParams({ pageSize: '50' });
      if (q) params.set('q', q);
      if (country) params.set('country', country);
      var r = await GS.get('/api/public/schools?' + params.toString());
      items = r.data; count = r.meta.total;
      box.innerHTML = items.length ? items.map(schoolCard).join('') : GS.emptyState(GS.t('none'));
    } else if (discoverMode === 'suppliers') {
      var s = await GS.get('/api/public/suppliers' + (q ? '?q=' + encodeURIComponent(q) : ''));
      items = s.data; count = s.meta.total;
      box.innerHTML = items.length ? items.map(supplierCard).join('') : GS.emptyState(GS.t('none'));
    } else {
      var a = await GS.get('/api/public/accommodation?school_id=INS-DEMO-0001');
      items = a.data; count = a.meta.total;
      box.innerHTML = items.length ? items.map(accommodationCard).join('') : GS.emptyState(GS.t('none'));
    }
    var c = document.getElementById('discoverCount');
    if (c) c.textContent = count + ' ' + (zh ? '条' : 'items');
  } catch (e) { box.innerHTML = GS.errorState(e.message); }
}

function schoolCard(s) {
  var zh = GS.lang === 'zh';
  var name = GS.label(s.name);
  return GS.card('<div class="row"><div class="school"><div class="schoolmark">' + GS.esc((name || 'G').slice(0, 1)) + '</div>' +
    '<div><h3>' + GS.esc(name) + '</h3><div class="muted">' + GS.esc([GS.label(s.location && s.location.country), GS.label(s.location && s.location.city)].filter(Boolean).join(' · ')) + '</div></div></div>' +
    (s.verification && s.verification.is_demo ? '<span class="status demo">' + GS.esc(zh ? '演示' : 'DEMO') + '</span>' : '<span class="status good">' + GS.esc(zh ? '已核验' : 'VERIFIED') + '</span>') + '</div>' +
    '<div class="split"><div><small>' + GS.esc(zh ? '年学费' : 'Tuition / year') + '</small><b>' + GS.esc(GS.money(s.fees && s.fees.tuition_min, s.fees && s.fees.currency)) + '</b></div>' +
    '<div><small>' + GS.esc(zh ? '最近交通' : 'Nearest transit') + '</small><b>' + GS.esc((s.transit && s.transit.distance_label) || '—') + '</b></div></div>' +
    '<div class="actions"><button class="btn ghost" onclick="schoolDetail(\'' + GS.esc(s.id) + '\')">' + GS.esc(GS.t('details')) + '</button>' +
    '<button class="btn primary" onclick="applyToSchool(\'' + GS.esc(s.id) + '\')">' + GS.esc(zh ? '申请' : 'Apply') + '</button></div>');
}

function supplierCard(s) {
  var zh = GS.lang === 'zh';
  return GS.card('<div class="row"><div><h3>' + GS.esc(GS.label(s.name || s)) + '</h3>' +
    '<div class="muted">' + GS.esc(s.type || '') + ' · ' + GS.esc((s.profile && s.profile.service_countries || []).join(' / ')) + '</div></div>' +
    (s.verification && s.verification.is_demo ? '<span class="status demo">' + GS.esc(zh ? '演示' : 'DEMO') + '</span>' : '<span class="status good">' + GS.esc(zh ? '已核验' : 'VERIFIED') + '</span>') + '</div>' +
    (s.profile ? '<div class="muted" style="margin-top:6px">' + GS.esc(GS.label(s.profile.description || s.profile.description_en)) + '</div>' : '') +
    '<div class="actions"><button class="btn ghost" onclick="supplierDetail(\'' + GS.esc(s.id) + '\')">' + GS.esc(GS.t('details')) + '</button>' +
    '<button class="btn primary" onclick="orderService(\'' + GS.esc(s.id) + '\')">' + GS.esc(zh ? '选购服务' : 'Order service') + '</button></div>');
}

function accommodationCard(a) {
  var zh = GS.lang === 'zh';
  return GS.card('<div class="row"><div><h3>' + GS.esc(GS.label(a.name || a)) + '</h3>' +
    '<div class="muted">' + GS.esc(a.room_type || '') + ' · ' + GS.esc(zh ? '可用床位 ' : 'Available beds ') + GS.esc(Math.max(0, (a.beds_total || 0) - (a.beds_occupied || 0))) + '</div></div>' +
    '<span class="status blue">' + GS.esc(GS.money(a.price, a.currency)) + '</span></div>' +
    (a.distance_label ? '<div class="split"><div><small>' + GS.esc(zh ? '直线距离' : 'Straight-line distance') + '</small><b>' + GS.esc(a.distance_label) + '</b></div></div>' : '') +
    '<div class="actions"><button class="btn primary" onclick="bookRoom(\'' + GS.esc(a.id) + '\')">' + GS.esc(zh ? '预订' : 'Book') + '</button></div>');
}

function schoolDetail(id) {
  GS.openDrawer(GS.t('details'), GS.emptyState(GS.t('loading')));
  GS.get('/api/public/schools/' + encodeURIComponent(id)).then(function (s) {
    var d = s.data;
    GS.openDrawer(GS.label(d.name),
      '<div class="kv">' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '类型' : 'Type') + '</small><b>' + GS.esc(d.institution_type || '—') + '</b></div>' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '教学语言' : 'Language') + '</small><b>' + GS.esc((d.languages && d.languages.primary) || '—') + '</b></div>' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '学费' : 'Tuition') + '</small><b>' + GS.esc(GS.money(d.fees && d.fees.tuition_min, d.fees && d.fees.currency)) + '</b></div>' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '住宿' : 'Boarding') + '</small><b>' + GS.esc(d.boarding ? GS.t('yes') : GS.t('no')) + '</b></div>' +
      '</div>' +
      '<div style="margin-top:10px">' + (d.source && d.source.source_url
        ? GS.notice(GS.lang === 'zh' ? '来源：' + d.source.source_url : 'Source: ' + d.source.source_url)
        : GS.notice(GS.lang === 'zh' ? '演示数据，不代表真实学校或合作关系。' : 'Demonstration record. No real school or partnership is claimed.')) + '</div>');
  }).catch(function (e) { GS.openDrawer(GS.t('details'), GS.errorState(e.message)); });
}

function supplierDetail(id) {
  GS.openDrawer(GS.t('details'), GS.emptyState(GS.t('loading')));
  GS.get('/api/public/suppliers/' + encodeURIComponent(id)).then(function (s) {
    var d = s.data;
    GS.openDrawer(GS.label(d.name),
      '<div class="muted">' + GS.esc(GS.label(d.profile && d.profile.description || d.profile && d.profile.description_en)) + '</div>' +
      '<div class="kv" style="margin-top:9px">' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '服务国家' : 'Countries') + '</small><b>' + GS.esc((d.profile && d.profile.service_countries || []).join(', ') || '—') + '</b></div>' +
      '<div><small>' + GS.esc(GS.lang === 'zh' ? '语言' : 'Languages') + '</small><b>' + GS.esc((d.profile && d.profile.languages || []).join(', ') || '—') + '</b></div>' +
      '</div>' +
      '<div style="margin-top:10px">' + GS.notice(GS.lang === 'zh' ? '联系方式仅在绑定后由服务机构提供；平台不向学生展示供应商私人联系方式。' : 'Contact details are provided by your agency after binding. The platform never shows a supplier private contact channel.') + '</div>');
  }).catch(function (e) { GS.openDrawer(GS.t('details'), GS.errorState(e.message)); });
}

function applyToSchool(id) {
  if (!caps || !caps.bound) { alert(GS.lang === 'zh' ? '请先绑定服务机构。' : 'Please bind an agency first.'); return; }
  GS.post('/api/c/applications', { title: 'School application ' + id }).then(function () {
    alert(GS.lang === 'zh' ? '申请已创建（S0 意向）' : 'Application created (S0 Lead)');
    showTab('apply', TAB_NAMES);
    refresh();
  }).catch(function (e) { alert(e.message); });
}

function orderService(supplierId) {
  if (!caps || !caps.bound) { alert(GS.lang === 'zh' ? '绑定后可自主选择与购买服务。' : 'Bind first to order services by yourself.'); return; }
  GS.post('/api/c/applications', { title: 'Service order', supplier_id: supplierId }).then(function () {
    alert(GS.lang === 'zh' ? '已创建服务委托申请' : 'Service order created');
    showTab('apply', TAB_NAMES);
    refresh();
  }).catch(function (e) { alert(e.message); });
}

function bookRoom() {
  alert(GS.lang === 'zh' ? '请联系你的服务机构完成住宿预订（住宿供应商流程）。' : 'Ask your agency to complete the accommodation booking (accommodation supplier flow).');
}

function submitRequirementFlow() {
  var zh = GS.lang === 'zh';
  GS.openDrawer(zh ? '提交留学需求' : 'Submit a requirement',
    '<div class="field"><label>' + GS.esc(zh ? '目标国家（逗号分隔）' : 'Target countries (comma separated)') + '</label><input id="reqCountries" value="SG"></div>' +
    '<div class="field"><label>' + GS.esc(zh ? '学段' : 'Stage') + '</label><input id="reqStages" value="MASTER"></div>' +
    '<div class="field"><label>' + GS.esc(zh ? '目标课程' : 'Target courses') + '</label><input id="reqCourses" value="Computer Science"></div>' +
    '<div class="field"><label>' + GS.esc(zh ? '语言' : 'Languages') + '</label><input id="reqLanguages" value="ZH"></div>' +
    '<div class="field"><label>' + GS.esc(zh ? '预算' : 'Budget') + '</label><input id="reqBudget" placeholder="50000"></div>' +
    '<div class="form-actions"><button class="btn ghost" onclick="GS.closeDrawer()">' + GS.esc(GS.t('cancel')) + '</button>' +
    '<button class="btn primary" onclick="submitRequirement()">' + GS.esc(GS.t('submit')) + '</button></div>');
}

function splitList(value) {
  return String(value || '').split(',').map(function (v) { return v.trim(); }).filter(Boolean);
}

function submitRequirement() {
  GS.post('/api/c/requirements', {
    target_countries: splitList(document.getElementById('reqCountries').value),
    target_stages: splitList(document.getElementById('reqStages').value),
    target_courses: splitList(document.getElementById('reqCourses').value),
    languages: splitList(document.getElementById('reqLanguages').value),
    budget_max: Number(document.getElementById('reqBudget').value) || null
  }).then(function (r) {
    GS.closeDrawer();
    showRecommendations(r.data.recommendation);
    refresh();
  }).catch(function (e) { alert(e.message); });
}

function showRecommendations(rec) {
  var zh = GS.lang === 'zh';
  var html = '<div class="banner ' + (rec.mode === 'browse_only' ? 'warn' : 'ok') + '">' +
    GS.esc(rec.mode === 'browse_only'
      ? (zh ? '暂无符合条件的服务机构，已进入仅浏览模式。' : 'No eligible agency — browse-only mode.')
      : (zh ? '已按 Level 2 优先规则生成推荐。' : 'Recommendations generated with Level 2 priority.')) + '</div>';
  (rec.candidates || []).forEach(function (c) {
    html += GS.card('<div class="row"><div><h3>' + GS.esc(c.level) + '</h3>' +
      '<div class="muted">' + GS.esc((c.reasons || []).join(' · ')) + '</div></div>' +
      '<span class="status blue">' + GS.esc(zh ? '匹配度 ' : 'Match ') + GS.esc(c.match_score) + '</span></div>' +
      '<div class="chips" style="margin-top:7px">' +
      (c.languages || []).map(function (l) { return '<span class="chip">' + GS.esc(l) + '</span>'; }).join('') +
      (c.service_countries || []).map(function (l) { return '<span class="chip blue">' + GS.esc(l) + '</span>'; }).join('') +
      '</div>' +
      '<div class="actions"><button class="btn primary" onclick="chooseAgency(\'' + GS.esc(c.b_organization_id) + '\')">' + GS.esc(zh ? '选择此机构' : 'Choose this agency') + '</button></div>');
  });
  GS.openDrawer(zh ? '推荐的服务机构' : 'Recommended agencies', html);
}

// Fix 4: binding request has loading + double-submit protection, success shows
// the binding number, failures show the real reason with a retry — no more
// silent "click does nothing".
var chooseInFlight = false;
function chooseAgency(bOrgId) {
  if (chooseInFlight) return; // double-tap guard
  chooseInFlight = true;
  var zh = GS.lang === 'zh';
  GS.openDrawer(zh ? '绑定服务机构' : 'Bind agency', '<div class="notice">' + GS.esc(zh ? '正在提交绑定申请…' : 'Submitting binding request…') + '</div>');
  GS.post('/api/c/bindings', { b_organization_id: bOrgId }).then(function (r) {
    chooseInFlight = false;
    var b = r.data || {};
    GS.closeDrawer();
    GS.openDrawer(zh ? '绑定申请已提交' : 'Binding request sent',
      '<div class="banner ok">' + GS.esc(zh ? '绑定申请已提交，等待服务机构确认。' : 'Binding request sent. Waiting for the agency to confirm.') + '</div>' +
      '<div class="kv"><div><small>' + GS.esc(zh ? 'Binding 编号' : 'Binding No.') + '</small><b>' + GS.esc(b.id || b.binding_id || '—') + '</b></div>' +
      '<div><small>' + GS.esc(GS.t('status')) + '</small><b>' + GS.esc(b.status || 'pending_b_request') + '</b></div></div>' +
      (b.duplicate ? '<div class="notice" style="margin-top:9px">' + GS.esc(zh ? '检测到重复提交，已返回已有申请（未重复创建）。' : 'Duplicate submit detected — the existing request was returned (not duplicated).') + '</div>' : ''));
    refresh();
  }).catch(function (e) {
    chooseInFlight = false;
    var zh2 = GS.lang === 'zh';
    var detail = (e.payload && e.payload.failures && e.payload.failures.length)
      ? '<div class="notice">' + GS.esc(zh2 ? '该机构未通过平台准入：' : 'The agency failed platform admission: ') + GS.esc(e.payload.failures.join(', ')) + '</div>' : '';
    GS.openDrawer(zh2 ? '绑定失败' : 'Binding failed',
      '<div class="banner err">' + GS.esc(e.message) + '</div>' + detail +
      '<div class="form-actions"><button class="btn ghost" onclick="GS.closeDrawer()">' + GS.esc(GS.t('cancel')) + '</button>' +
      '<button class="btn primary" onclick="chooseAgency(\'' + GS.esc(bOrgId) + '\')">' + GS.esc(zh2 ? '重试' : 'Retry') + '</button></div>');
  });
}

function renderApply(main) {
  var zh = GS.lang === 'zh';
  if (!state.applications.length) {
    main.innerHTML = '<section class="section">' + GS.emptyState(zh ? '还没有申请。' : 'No applications yet.') + '</section>';
    return;
  }
  main.innerHTML = '<section class="section">' + GS.sectionHead(zh ? '申请' : 'Applications', state.applications.length + '') +
    '<div class="list">' + state.applications.map(applicationCard).join('') + '</div></section>';
}

function applicationCard(a) {
  var zh = GS.lang === 'zh';
  var stage = a.current_stage;
  var strip = ['S0', 'S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8', 'S9', 'S10'].map(function (code) {
    var cls = 'stage-pill';
    if (code === stage) cls += ' current';
    else if (code < stage) cls += ' done';
    return '<span class="' + cls + '">' + GS.esc(GS.stageLabel(code)) + '</span>';
  }).join('');
  return GS.card('<div class="row"><div><h3>' + GS.esc(a.title || a.id) + '</h3>' +
    '<div class="muted">' + GS.esc(a.id) + ' · ' + GS.esc(GS.date(a.created_at)) + '</div></div>' +
    GS.statusTag(a.status) + '</div>' +
    '<div class="stage-strip">' + strip + '</div>' +
    '<div class="actions"><button class="btn ghost" onclick="applicationDetail(\'' + GS.esc(a.id) + '\')">' + GS.esc(GS.t('details')) + '</button>' +
    '<button class="btn soft" onclick="uploadDocumentFlow(\'' + GS.esc(a.id) + '\')">' + GS.esc(zh ? '上传材料' : 'Upload') + '</button>' +
    '<button class="btn ghost" onclick="visaDetail(\'' + GS.esc(a.id) + '\')">' + GS.esc(zh ? '签证' : 'Visa') + '</button></div>');
}

function applicationDetail(id) {
  var zh = GS.lang === 'zh';
  GS.openDrawer(GS.t('details'), GS.emptyState(GS.t('loading')));
  GS.get('/api/c/applications/' + encodeURIComponent(id)).then(function (r) {
    var a = r.data;
    var html = '<div class="stage-strip">' + (a.stages || []).map(function (s) {
      var cls = 'stage-pill';
      if (s.code === a.current_stage) cls += ' current';
      else if (s.status === 'completed') cls += ' done';
      return '<span class="' + cls + '">' + GS.esc(GS.stageLabel(s.code)) + '</span>';
    }).join('') + '</div>';
    html += '<div class="timeline">' + (a.timeline || []).map(function (e) {
      return '<div class="timeline-item done"><h5>' + GS.esc(GS.stageLabel(e.stage)) + ' · ' + GS.esc(e.event) + '</h5><small>' + GS.esc(GS.datetime(e.at)) + '</small></div>';
    }).join('') + '</div>';
    html += '<div class="section-head"><h3>' + GS.esc(zh ? '材料' : 'Documents') + '</h3></div>';
    html += (a.documents || []).length
      ? (a.documents || []).map(function (d) {
          return '<div class="row-item"><div class="grow"><h4>' + GS.esc(d.type) + '</h4><div class="muted">' + GS.esc(d.file_name || '') + '</div></div>' + GS.statusTag(d.status) + '</div>';
        }).join('')
      : GS.emptyState(zh ? '暂无材料' : 'No documents');
    html += '<div class="section-head"><h3>' + GS.esc(zh ? '待办' : 'Todos') + '</h3></div>';
    html += (a.todos || []).length
      ? (a.todos || []).map(function (t) {
          return '<div class="row-item"><div class="grow"><h4>' + GS.esc(t.title) + '</h4><div class="muted">' + GS.esc(t.stage || '') + '</div></div>' + GS.statusTag(t.status) + '</div>';
        }).join('')
      : GS.emptyState(zh ? '暂无待办' : 'No todos');
    GS.openDrawer(zh ? '申请详情' : 'Application detail', html);
  }).catch(function (e) { GS.openDrawer(GS.t('details'), GS.errorState(e.message)); });
}

function uploadDocumentFlow(appId) {
  var zh = GS.lang === 'zh';
  GS.openDrawer(zh ? '上传材料' : 'Upload document',
    '<div class="field"><label>' + GS.esc(zh ? '材料类型' : 'Type') + '</label><select id="docType">' +
    ['passport', 'transcript', 'degree', 'language_score', 'offer', 'visa', 'medical', 'certification', 'other']
      .map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label>' + GS.esc(zh ? '文件名' : 'File name') + '</label><input id="docName" value="document.pdf"></div>' +
    '<div class="notice">' + GS.esc(zh ? 'OCR 分类为 Sandbox Mock，仅用于验证流程。' : 'OCR classification is a sandbox mock used only to validate the flow.') + '</div>' +
    '<div class="form-actions"><button class="btn primary" onclick="uploadDocument(\'' + GS.esc(appId) + '\')">' + GS.esc(GS.t('submit')) + '</button></div>');
}

function uploadDocument(appId) {
  GS.post('/api/c/applications/' + encodeURIComponent(appId) + '/documents', {
    type: document.getElementById('docType').value,
    file_name: document.getElementById('docName').value
  }).then(function () {
    GS.closeDrawer();
    alert(GS.lang === 'zh' ? '材料已上传，等待服务机构确认。' : 'Document uploaded — waiting for the agency to confirm.');
    refresh();
  }).catch(function (e) { alert(e.message); });
}

function visaDetail(appId) {
  var zh = GS.lang === 'zh';
  GS.openDrawer(zh ? '签证中心' : 'Visa centre', GS.emptyState(GS.t('loading')));
  GS.get('/api/c/applications/' + encodeURIComponent(appId) + '/visa').then(function (r) {
    var v = r.data;
    GS.openDrawer(zh ? '签证中心' : 'Visa centre',
      '<div class="kv"><div><small>' + GS.esc(GS.t('status')) + '</small><b>' + GS.esc(v.status || '—') + '</b></div></div>' +
      '<div class="notice" style="margin-top:9px">' + GS.esc(zh ? '学生端只查看步骤、进度、待办与结果；正式签证操作由服务机构执行。' : 'You can only view steps, progress, todos and the result. Formal visa actions are performed by your agency.') + '</div>');
  }).catch(function (e) { GS.openDrawer(zh ? '签证中心' : 'Visa centre', GS.errorState(e.message)); });
}

function renderService(main) {
  var zh = GS.lang === 'zh';
  var entries = [
    { key: 'accommodation', label: zh ? '住宿预订' : 'Accommodation' },
    { key: 'medical', label: zh ? '体检委托' : 'Medical' },
    { key: 'certification', label: zh ? '文件认证' : 'Certification' },
    { key: 'visa', label: zh ? '签证进度' : 'Visa progress' }
  ];
  main.innerHTML = '<section class="section">' + GS.sectionHead(zh ? '服务中心' : 'Services', '') +
    '<div class="rows">' + entries.map(function (e) {
      return '<div class="row-item" onclick="serviceDetail(\'' + e.key + '\')"><div class="grow"><h4>' + GS.esc(e.label) + '</h4>' +
        '<div class="muted">' + GS.esc(zh ? '点击查看' : 'Tap to view') + '</div></div><span class="chip">›</span></div>';
    }).join('') + '</div></section>';
}

function serviceDetail(key) {
  var zh = GS.lang === 'zh';
  var text = {
    accommodation: zh ? '住宿由住宿供应商提供，绑定后可通过服务机构预订。' : 'Accommodation is provided by the accommodation supplier; book through your agency once bound.',
    medical: zh ? '体检委托保存预约、状态、完成与报告文件，不保存医疗诊断。' : 'Medical orders store appointment, status, completion and report files — never a diagnosis.',
    certification: zh ? '文件认证覆盖学历、成绩、公证与翻译认证。' : 'Certification covers degree, transcript, notarisation and translation.',
    visa: zh ? '签证步骤与结果由服务机构录入，学生只读。' : 'Visa steps and results are entered by your agency; you have read-only access.'
  }[key];
  GS.openDrawer(GS.t('details'), GS.notice(text));
}

function renderMe(main) {
  var zh = GS.lang === 'zh';
  if (!me) { main.innerHTML = '<section class="section">' + GS.emptyState(GS.t('loading')) + '</section>'; return; }
  var u = me.user || {};
  var p = me.c_profile || {};
  main.innerHTML = '<section class="section">' +
    GS.metrics([
      [zh ? '绑定状态' : 'Binding', p.binding_state === 'active' ? GS.t('bound') : GS.t('notBound')],
      [zh ? '角色' : 'Role', u.role || '—']
    ]) +
    '<div class="section-head"><h2>' + GS.esc(zh ? '我的资料' : 'My profile') + '</h2></div>' +
    '<div class="kv">' +
    '<div><small>' + GS.esc(GS.t('email')) + '</small><b>' + GS.esc(u.email || '—') + '</b></div>' +
    '<div><small>' + GS.esc(zh ? '手机号' : 'Phone') + '</small><b>' + GS.esc(u.phone || '—') + '</b></div>' +
    '<div><small>' + GS.esc(zh ? '国籍' : 'Nationality') + '</small><b>' + GS.esc(p.nationality || '—') + '</b></div>' +
    '<div><small>' + GS.esc(zh ? '教育阶段' : 'Stage') + '</small><b>' + GS.esc(p.education_stage || '—') + '</b></div>' +
    '</div>' +
    '<div class="section-head"><h2>' + GS.esc(zh ? '支付记录' : 'Payments') + '</h2><span>' + state.payments.length + '</span></div>' +
    (state.payments.length
      ? '<div class="table-wrap"><table class="data"><thead><tr><th>' + GS.esc(GS.t('amount')) + '</th><th>' + GS.esc(zh ? '类型' : 'Type') + '</th><th>' + GS.esc(GS.t('status')) + '</th></tr></thead><tbody>' +
        state.payments.map(function (p) {
          return '<tr><td><b>' + GS.esc(GS.money(p.amount, p.currency)) + '</b></td><td>' + GS.esc(p.kind) + '</td><td>' + GS.statusTag(p.status) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : GS.emptyState(zh ? '暂无支付' : 'No payments')) +
    '<div class="section-head"><h2>' + GS.esc(zh ? '消息' : 'Messages') + '</h2><span>' + state.messages.length + '</span></div>' +
    (state.messages.length
      ? '<div class="rows">' + state.messages.map(function (m) {
          return '<div class="row-item"><div class="grow"><h4>' + GS.esc(m.body) + '</h4><div class="muted">' + GS.esc(GS.datetime(m.created_at)) + '</div></div></div>';
        }).join('') + '</div>'
      : GS.emptyState(zh ? '暂无消息' : 'No messages')) +
    '<div style="margin-top:14px"><button class="btn ghost wide" onclick="GS.logout()">' + GS.esc(GS.t('logout')) + '</button></div>' +
    '<div style="margin-top:9px">' + GS.sandboxNote() + '</div>' +
    '</section>';
}

async function loadMyB() {
  try {
    var r = await GS.get('/api/c/my-b');
    var box = document.getElementById('myB');
    if (!box) return;
    var zh = GS.lang === 'zh';
    box.innerHTML = GS.card('<div class="row"><div><h3>' + GS.esc(GS.label(r.data.organization)) + '</h3>' +
      '<div class="muted">' + GS.esc(zh ? '绑定时间 ' : 'Bound ') + GS.esc(GS.date(r.data.binding && r.data.binding.contract_effective_at)) + '</div></div>' +
      GS.statusTag(r.data.contract && r.data.contract.status) + '</div>' +
      (r.data.service_scope ? '<div class="chips" style="margin-top:7px">' +
        (r.data.service_scope.service_countries || []).map(function (c) { return '<span class="chip blue">' + GS.esc(c) + '</span>'; }).join('') +
        (r.data.service_scope.languages || []).map(function (c) { return '<span class="chip">' + GS.esc(c) + '</span>'; }).join('') +
        '</div>' : ''));
  } catch (_) { /* not bound yet */ }
}

async function loadBrief() {
  try {
    var r = await GS.get('/api/c/brief');
    state.brief = r.data;
    var box = document.getElementById('briefBox');
    if (!box) return;
    var zh = GS.lang === 'zh';
    var b = r.data;
    box.innerHTML = GS.card('<div class="row"><div><h4>' + GS.esc(zh ? '今日待办' : 'Today’s todos') + '</h4>' +
      '<div class="muted">' + GS.esc((b.today_todos || []).length + ' ' + (zh ? '项' : 'items')) + '</div></div></div>' +
      '<div class="split"><div><small>' + GS.esc(zh ? '临近截止' : 'Upcoming deadlines') + '</small><b>' + GS.esc((b.upcoming_deadlines || []).length) + '</b></div>' +
      '<div><small>' + GS.esc(zh ? '材料缺失' : 'Missing documents') + '</small><b>' + GS.esc((b.missing_documents || []).length) + '</b></div></div>');
  } catch (_) { /* brief is optional */ }
}

// Fix 3: identity is verified server-side on every boot. 401 → login panel;
// 403 audience mismatch → explicit wrong-identity panel. Endpoint failures are
// surfaced as errors, never disguised as empty lists.
async function refresh() {
  try {
    me = (await GS.verifyIdentity('C')).data || (await GS.get('/api/auth/me')).data;
  } catch (e) {
    if (e.code === 'AUDIENCE_MISMATCH') {
      document.getElementById('app').innerHTML = '<div class="phone">' + GS.identityMismatchPanel(e.actor) + '</div>';
      GS.bindIdentityPanels();
      return;
    }
    GS.clearSession();
    return showLogin();
  }
  caps = me.capabilities;
  var results = await Promise.all([
    GS.get('/api/c/applications'),
    GS.get('/api/c/documents'),
    GS.get('/api/c/payments'),
    GS.get('/api/c/messages'),
    GS.get('/api/c/todos')
  ]);
  state.applications = results[0].data || [];
  state.documents = results[1].data || [];
  state.payments = results[2].data || [];
  state.messages = results[3].data || [];
  state.todos = results[4].data || [];
  renderShell();
}

function showLogin() {
  window.renderLogin = function () { showLogin(); };
  document.getElementById('app').innerHTML = '<div class="phone">' + GS.loginPanel([]) + '</div>';
  GS.get('/api/auth/demo-accounts').then(function (r) {
    document.getElementById('app').innerHTML = '<div class="phone">' + GS.loginPanel(r.data) + '</div>';
    GS.bindLogin();
  }).catch(function () { GS.bindLogin(); });
}

window.onLangChange = function () { renderShell(); };

(async function boot() {
  if (GS.requireAuth()) { showLogin(); return; }
  await refresh();
})();
</script>
