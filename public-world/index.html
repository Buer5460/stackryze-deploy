<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062d4e">
<title>GlobalStudy — 选择客户端</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="portal">
  <div class="portal-inner">
    <div class="portal-brand" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:11px">
        <div class="logo">G</div>
        <div><b>GlobalStudy</b><small style="display:block;color:#bcd4e0" id="subTitle">公网 MVP · 选择客户端</small></div>
      </div>
      <button class="lang-btn" id="langBtn">English</button>
    </div>
    <h1 id="title">请选择要打开的客户端</h1>
    <p class="portal-lead" id="lead">五个角色的独立客户端，可直接进入使用。没有宣传介绍页，也不暴露内部管理工具。</p>
    <div class="client-grid" id="clientGrid"></div>
    <div class="portal-note" id="note">演示数据会明确标识；所有外部能力均标注 Demo / Sandbox。</div>
    <footer class="footer" style="color:#bcd4e0;border-top:1px solid rgba(255,255,255,.14)">
      <b style="color:#fff">GlobalStudy</b> · <span id="footerText">由安世达教育提供核心动力</span>
      <span class="footer-powered" id="footerPowered" style="color:#8fb3c4">Powered by Aethel Edu</span>
    </footer>
  </div>
</main>

<script src="/js/gs.js"></script>
<script>
var CLIENTS = [
  { route: '/student', icon: '🎓', zh: ['学生 / 家长端', '搜索学校、提交需求、绑定服务机构、申请、材料、支付。'], en: ['Student / Parent', 'Search schools, submit a requirement, bind an agency, apply, upload documents and pay.'] },
  { route: '/agent', icon: '🤝', zh: ['留学机构端', '客户池、绑定处理、S0–S10 看板、资源中心、佣金结算。'], en: ['Education Agent', 'Client pool, binding handling, the S0–S10 board, the resource centre and commission settlement.'] },
  { route: '/dbc', icon: '📜', zh: ['DBC 招生牌照', '状态 A 协议、供应商管理、招生申请与对账。'], en: ['DBC', 'State A agreements, supplier management, admissions and reconciliation.'] },
  { route: '/supplier/education', icon: '🏫', zh: ['教育机构', '课程发布、招生申请、录取流程、S0–S10 看板。'], en: ['Education', 'Program publishing, admissions, the offer workflow and the S0–S10 board.'] },
  { route: '/supplier/medical', icon: '🩺', zh: ['体检机构', '体检委托、预约、状态与报告文件。'], en: ['Medical', 'Check-up orders, appointments, status and report files.'] },
  { route: '/supplier/certification', icon: '📄', zh: ['文件认证', '学历 / 成绩 / 公证 / 翻译认证流程。'], en: ['Certification', 'Degree, transcript, notarisation and translation certification.'] },
  { route: '/supplier/visa', icon: '🛂', zh: ['签证代办', '签证服务产品、委托、材料、预约与结果。'], en: ['Visa Agency', 'Visa products, orders, materials, appointments and results.'] },
  { route: '/supplier/accommodation', icon: '🏠', zh: ['学生住宿', '房型 / 房间 / 床位库存、预订、入住与退宿。'], en: ['Accommodation', 'Room types, rooms, bed inventory, bookings, check-in and check-out.'] },
  { route: '/supplier/finance', icon: '💰', zh: ['教育金融（默认关闭）', '功能暂未开放 / Coming soon。'], en: ['Education Finance (off)', 'Feature not open yet / Coming soon.'] },
  { route: '/ads', icon: '📣', zh: ['广告中心', '充值、选位、素材、审核、排期、投放与报表。'], en: ['Ads Centre', 'Top-up, slot selection, creative, review, scheduling, delivery and reporting.'] },
  { route: '/admin', icon: '🛠️', zh: ['平台管理端', '需登录。统一用户、审核、推荐、合同、佣金与支付编排。'], en: ['Platform Admin', 'Login required. Unified users, verification, recommendation, contracts, commission and payment orchestration.'] },
  { route: '/institution', icon: '🗂️', zh: ['院校 / 供应商入口', '六类供应商统一入口，按类型进入对应客户端。'], en: ['Institution / Supplier entry', 'One entry for all six supplier types.'] }
];

function render() {
  var zh = GS.lang === 'zh';
  document.getElementById('subTitle').textContent = zh ? '公网 MVP · 选择客户端' : 'Public MVP · Choose a client';
  document.getElementById('title').textContent = zh ? '请选择要打开的客户端' : 'Choose a client to open';
  document.getElementById('lead').textContent = zh
    ? '五个角色的独立客户端，可直接进入使用。没有宣传介绍页，也不暴露内部管理工具。'
    : 'Five separate role clients. Open any one directly — no marketing page, no internal admin tools.';
  document.getElementById('note').textContent = zh
    ? '演示数据会明确标识；所有外部能力均标注 Demo / Sandbox。'
    : 'Demo data is clearly labelled; every external capability is marked Demo / Sandbox.';

  document.getElementById('clientGrid').innerHTML = CLIENTS.map(function (c) {
    var pair = zh ? c.zh : c.en;
    return '<a class="client-card" href="' + c.route + '">' +
      '<div class="icon">' + c.icon + '</div>' +
      '<h2>' + GS.esc(pair[0]) + '</h2>' +
      '<p>' + GS.esc(pair[1]) + '</p>' +
      '<div class="open">' + (zh ? '打开 →' : 'Open →') + '</div></a>';
  }).join('');
}

window.onLangChange = render;
window.onReady = render;
render();
</script>
</body>
</html>
