name: GlobalStudy CI

on:
  push:
    branches:
      - global-study-mvp
      - "workbuddy/**"
  pull_request:
    branches:
      - global-study-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Start smoke server
        run: |
          npm start > /tmp/globalstudy.log 2>&1 &
          echo $! > /tmp/globalstudy.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json

      - name: API health smoke
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | grep '"ok":true'

      - name: H5 four-role smoke
        run: |
          curl -fsS http://127.0.0.1:3000/ > /tmp/index.html
          grep -q "学生" /tmp/index.html
          grep -q "机构" /tmp/index.html
          grep -q "院校" /tmp/index.html
          grep -q "平台" /tmp/index.html

      - name: Stop smoke server
        if: always()
        run: |
          if [ -f /tmp/globalstudy.pid ]; then
            kill "$(cat /tmp/globalstudy.pid)" || true
          fi

      - name: Start public MVP smoke server
        run: |
          PORT=3001 npm run start:public > /tmp/globalstudy-public.log 2>&1 &
          echo $! > /tmp/globalstudy-public.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/tmp/public-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/public-health.json

      - name: Public MVP isolation smoke
        run: |
          curl -fsS http://127.0.0.1:3001/ > /tmp/public-index.html
          grep -q "Find the right school" /tmp/public-index.html
          test "$(curl -s -o /tmp/growth.json -w '%{http_code}' http://127.0.0.1:3001/api/growth/leads)" = "404"
          test "$(curl -s -o /tmp/admin.json -w '%{http_code}' http://127.0.0.1:3001/api/admin/import/preview)" = "404"

      - name: Stop public MVP smoke server
        if: always()
        run: |
          if [ -f /tmp/globalstudy-public.pid ]; then
            kill "$(cat /tmp/globalstudy-public.pid)" || true
          fi
