name: GlobalStudy CI

on:
  push:
    branches:
      - global-study-mvp
      - "workbuddy/**"
  pull_request:
    branches:
      - global-study-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: Start MVP server
        run: |
          npm start > /tmp/globalstudy.log 2>&1 &
          echo $! > /tmp/globalstudy.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json

      - name: API health smoke
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:3000/api/health | grep '"version":"3.0.2"'

      - name: Public clients are reachable
        run: |
          for path in / /student /agent /dbc /supplier/education /supplier/medical \
                     /supplier/certification /supplier/visa /supplier/accommodation \
                     /supplier/finance /ads /admin /institution; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            test "$code" = "200"
            grep -q "GlobalStudy" /tmp/page.html
          done

      - name: Chinese default with English switch on every client
        run: |
          for path in / /student /agent /dbc /supplier/education /supplier/medical \
                     /supplier/certification /supplier/visa /supplier/accommodation \
                     /supplier/finance /ads /admin /institution; do
            curl -fsS "http://127.0.0.1:3000$path" > /tmp/page.html
            grep -q 'lang="zh-CN"' /tmp/page.html || { echo "$path is not Chinese by default"; exit 1; }
            grep -q "English" /tmp/page.html || { echo "$path has no English switch"; exit 1; }
            grep -q "Powered by Aethel Edu\|由安世达教育提供核心动力" /tmp/page.html || { echo "$path missing operator credit"; exit 1; }
          done

      - name: Internal APIs are not publicly readable
        run: |
          for path in /api/admin/dashboard /api/b/me /api/c/me /api/dbc/me \
                     /api/admin/import/preview /api/admin/queue; do
            code=$(curl -s -o /tmp/api.json -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            test "$code" = "401"
          done
          for path in /api/growth/leads /api/b2b/schools /api/b2b/programs; do
            code=$(curl -s -o /tmp/api.json -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code (removed route)"
            test "$code" = "404"
          done

      - name: Public API hides commission and private contact
        run: |
          curl -fsS http://127.0.0.1:3000/api/public/suppliers > /tmp/suppliers.json
          ! grep -q "commission_value" /tmp/suppliers.json
          ! grep -q "contact_phone" /tmp/suppliers.json
          ! grep -q "contact_whatsapp" /tmp/suppliers.json

      - name: Demo login works end to end
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3000/api/auth/demo-login \
            -H 'Content-Type: application/json' \
            -d '{"token":"demo-student-01"}' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$TOKEN"
          curl -fsS http://127.0.0.1:3000/api/auth/me -H "Authorization: Bearer $TOKEN" | grep '"ok":true'

      - name: Finance feature is off by default
        run: |
          code=$(curl -s -o /tmp/finance.json -w '%{http_code}' http://127.0.0.1:3000/api/s/finance/me)
          echo "finance -> $code"
          test "$code" = "403"
          grep -q "FINANCE_DISABLED" /tmp/finance.json

      - name: Persistence backend is reported honestly
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | grep -E '"backend":"(postgresql|json-file|memory)"'

      - name: Snapshot export is admin-only (Fix 2)
        run: |
          test "$(curl -s -o /tmp/snap.json -w '%{http_code}' http://127.0.0.1:3000/api/admin/snapshot/export)" = "401"
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.local","password":"demo1234"}' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          curl -fsS http://127.0.0.1:3000/api/admin/snapshot/export \
            -H "Authorization: Bearer $TOKEN" > /tmp/snapshot-export.json
          node -e "const d=require('/tmp/snapshot-export.json'); if(!d.ok||!d.data.counts.users) process.exit(1)"
          ! grep -q "DATABASE_URL" /tmp/snapshot-export.json
          ! grep -qE "postgres(ql)?://" /tmp/snapshot-export.json

      - name: Snapshot restore script tolerates a missing branch
        run: |
          GS_DB_DIR="$(mktemp -d)" GS_SNAPSHOT_BRANCH="ci-missing-branch" \
            bash scripts/snapshot-restore.sh | grep -q "fresh dataset"

      - name: Stop MVP server
        if: always()
        run: |
          if [ -f /tmp/globalstudy.pid ]; then
            kill "$(cat /tmp/globalstudy.pid)" || true
          fi
