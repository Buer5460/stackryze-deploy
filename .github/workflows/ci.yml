name: CI

# V1.0 gate: npm install → npm test → smoke test.
# A red run must block the merge. See V1.0_IMPLEMENTATION_REPORT.md.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Start server and smoke test /api/health
        run: |
          node server.js &
          SERVER_PID=$!
          # Wait for the port to accept connections instead of sleeping blindly.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "server is up after ${i} attempt(s)"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health | tee health.json
          grep -q '"status":"ok"' health.json
          curl -sf http://127.0.0.1:3000/ | grep -q '学生 / 家长端'
          kill $SERVER_PID
