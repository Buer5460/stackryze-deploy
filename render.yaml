services:
  - type: web
    name: global-study-mobile-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DEFAULT_TIMEZONE_OFFSET_MINUTES
        value: 480
      # Set to a PostgreSQL connection string to switch the platform to
      # PostgreSQL (preferred when a managed database is available). When unset,
      # the service uses the snapshot backend described below.
      - key: DATABASE_URL
        sync: false
      # Snapshot backend (V3.0.3): OFF by default. The public `data-snapshot`
      # branch carries only a whitelisted, non-sensitive catalogue subset and
      # must NOT be used as the runtime database — restoring it strips fields
      # business rules need. Real persistence requires DATABASE_URL (private
      # PostgreSQL). Set GS_SNAPSHOT_ENABLED=1 only for demo seeding.
      - key: GS_SNAPSHOT_ENABLED
        value: "0"
      # Directory for the JSON file backend when the snapshot backend is off.
      - key: GS_DB_DIR
        value: /var/data
      - key: APP_TOKEN
        sync: false
